<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUNFISH — Editor</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #faf9f7;
  color: #444;
  font-family: Georgia, "Malgun Gothic", serif;
}

main {
  width: min(960px, 94%);
  margin: 55px auto;
}

h1 {
  font-weight: normal;
  font-size: 32px;
  letter-spacing: 3px;
  color: #888;
  text-align: center;
}

.subtitle {
  text-align: center;
  color: #aaa;
  font-size: 12px;
  margin-bottom: 35px;
}

.editor-box {
  background: white;
  border: 1px solid #e5e5e5;
  border-radius: 10px;
  overflow: hidden;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 14px;
  background: #f5f5f5;
  border-bottom: 1px solid #e5e5e5;
}

button, select, input {
  height: 35px;
  border: 1px solid #ddd;
  border-radius: 5px;
  background: white;
  color: #555;
}

button, select, input[type="color"] {
  cursor: pointer;
}

button {
  min-width: 35px;
  padding: 0 10px;
}

button:hover { background: #eee; }

select { padding: 0 7px; }

#fontFamily { max-width: 145px; }
#fontSize { width: 80px; }
#letterSpacing { width: 76px; }
#lineHeight { width: 76px; }

input[type="color"] {
  width: 40px;
  padding: 3px;
}

.tool-group {
  display: flex;
  align-items: center;
  gap: 5px;
}

.tool-label {
  font-size: 11px;
  color: #888;
  white-space: nowrap;
}

#editor {
  min-height: 380px;
  padding: 30px;
  outline: none;
  font-size: 15px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

#editor:empty::before {
  content: "여기에 글을 작성해 보세요...";
  color: #bbb;
}

.bottom {
  padding: 14px;
  border-top: 1px solid #eee;
  text-align: right;
}

.bottom button { padding: 0 15px; }

.notice {
  font-size: 12px;
  color: #999;
  text-align: center;
  line-height: 1.8;
  margin-top: 20px;
}
</style>
</head>

<body>
<main>
  <h1>SUNFISH</h1>
  <p class="subtitle">WRITING EDITOR</p>

  <div class="editor-box">
    <div class="toolbar">

      <button type="button" data-command="bold"
        title="굵게"><b>B</b></button>

      <button type="button" data-command="italic"
        title="기울임"><i>I</i></button>

      <button type="button" data-command="underline"
        title="밑줄"><u>U</u></button>

      <button type="button" data-command="strikeThrough"
        title="취소선"><s>S</s></button>

      <select id="fontFamily" title="글꼴">
        <option value="">글꼴 선택</option>
        <option value="Georgia">Georgia</option>
        <option value="Arial">Arial</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Malgun Gothic">맑은 고딕</option>
        <option value="Batang">바탕</option>
        <option value="Gulim">굴림</option>
        <option value="Gungsuh">궁서</option>
      </select>

      <div class="tool-group">
        <span class="tool-label">크기</span>
        <select id="fontSize" title="글자 크기">
          <option value="">크기</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
          <option value="13">13</option>
          <option value="14">14</option>
          <option value="15">15</option>
          <option value="16">16</option>
          <option value="18">18</option>
          <option value="20">20</option>
          <option value="24">24</option>
          <option value="28">28</option>
          <option value="32">32</option>
          <option value="36">36</option>
          <option value="40">40</option>
          <option value="48">48</option>
          <option value="60">60</option>
          <option value="72">72</option>
        </select>
      </div>

      <div class="tool-group">
        <span class="tool-label">자간</span>
        <select id="letterSpacing" title="글자 간격">
          <option value="">자간</option>
          <option value="-2">-2</option>
          <option value="-1">-1</option>
          <option value="0">0</option>
          <option value="0.5">0.5</option>
          <option value="1">1</option>
          <option value="1.5">1.5</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="8">8</option>
          <option value="10">10</option>
          <option value="12">12</option>
        </select>
      </div>

      <div class="tool-group">
        <span class="tool-label">행간</span>
        <select id="lineHeight" title="줄 간격">
          <option value="">행간</option>
          <option value="1">1.0</option>
          <option value="1.2">1.2</option>
          <option value="1.4">1.4</option>
          <option value="1.6">1.6</option>
          <option value="1.8">1.8</option>
          <option value="2">2.0</option>
          <option value="2.5">2.5</option>
          <option value="3">3.0</option>
        </select>
      </div>

      <div class="tool-group">
        <span class="tool-label">글자색</span>
        <input type="color" id="textColor"
          value="#d47791" title="글자 색상">
      </div>

      <div class="tool-group">
        <span class="tool-label">형광펜</span>
        <input type="color" id="highlightColor"
          value="#fff0a8" title="형광펜 색상">
      </div>

      <button type="button" data-command="removeFormat"
        title="서식 지우기">Tx</button>
    </div>

    <div id="editor" contenteditable="true" spellcheck="false">
      <p>안녕하세요. SUNFISH 편집기입니다.</p>
      <p>원하는 글자를 드래그해서 색상, 크기, 자간을 바꿔 보세요.</p>
      <p>행간은 선택한 문단에 적용됩니다.</p>
    </div>

    <div class="bottom">
      <button type="button" id="copyButton">
        작성한 글 복사
      </button>
    </div>
  </div>

  <p class="notice">
    글 저장과 게시는 관리자 로그인 후 사용할 수 있습니다.
  </p>
</main>

<script>
const editor = document.getElementById("editor");
let savedRange = null;

function isInsideEditor(node) {
  return node === editor || editor.contains(node);
}

function saveSelection() {
  const selection = window.getSelection();
  if (!selection || !selection.rangeCount) return;

  const range = selection.getRangeAt(0);

  if (isInsideEditor(range.commonAncestorContainer)) {
    savedRange = range.cloneRange();
  }
}

function restoreSelection() {
  editor.focus();

  if (!savedRange) return false;

  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(savedRange);
  return true;
}

function applyCommand(command, value = null) {
  if (!restoreSelection()) return;

  document.execCommand("styleWithCSS", false, true);
  document.execCommand(command, false, value);
  saveSelection();
}

/*
  선택한 글자에 CSS 스타일을 적용합니다.
  색상과 마찬가지로 선택 범위를 보존합니다.
*/
function applyInlineStyle(property, value) {
  if (!restoreSelection()) return;

  const selection = window.getSelection();
  if (!selection.rangeCount) return;

  const range = selection.getRangeAt(0);

  if (range.collapsed) {
    alert("먼저 꾸밀 글자를 드래그해 주세요.");
    return;
  }

  const span = document.createElement("span");
  span.style[property] = value;

  try {
    const contents = range.extractContents();
    span.appendChild(contents);
    range.insertNode(span);

    const newRange = document.createRange();
    newRange.selectNodeContents(span);

    selection.removeAllRanges();
    selection.addRange(newRange);

    savedRange = newRange.cloneRange();
  } catch (error) {
    console.error(error);
    alert("이 선택 범위에는 적용하지 못했어요.");
  }
}

/*
  행간은 글자 한두 개가 아니라
  선택한 문단 전체에 적용합니다.
*/
function applyLineHeight(value) {
  if (!restoreSelection()) return;

  const selection = window.getSelection();
  if (!selection.rangeCount) return;

  const range = selection.getRangeAt(0);
  const paragraphs = Array.from(
    editor.querySelectorAll("p, div, li, h1, h2, h3, h4")
  );

  let applied = false;

  paragraphs.forEach(paragraph => {
    if (range.intersectsNode(paragraph)) {
      paragraph.style.lineHeight = value;
      applied = true;
    }
  });

  if (!applied) {
    editor.style.lineHeight = value;
  }

  saveSelection();
}

/* 드래그 선택 유지 */
document.addEventListener("selectionchange", saveSelection);

/* 기본 서식 버튼 */
document.querySelectorAll("[data-command]")
  .forEach(button => {
    button.addEventListener("mousedown", event => {
      event.preventDefault();
    });

    button.addEventListener("click", () => {
      applyCommand(button.dataset.command);
    });
  });

/* 글꼴 */
document.getElementById("fontFamily")
  .addEventListener("change", event => {
    if (event.target.value) {
      applyCommand("fontName", event.target.value);
    }
    event.target.value = "";
  });

/* 숫자 크기 (px) */
document.getElementById("fontSize")
  .addEventListener("change", event => {
    if (event.target.value) {
      applyInlineStyle(
        "fontSize",
        event.target.value + "px"
      );
    }
    event.target.value = "";
  });

/* 자간 (px) */
document.getElementById("letterSpacing")
  .addEventListener("change", event => {
    if (event.target.value !== "") {
      applyInlineStyle(
        "letterSpacing",
        event.target.value + "px"
      );
    }
    event.target.value = "";
  });

/* 행간 (배율) */
document.getElementById("lineHeight")
  .addEventListener("change", event => {
    if (event.target.value) {
      applyLineHeight(event.target.value);
    }
    event.target.value = "";
  });

/* 글자 색상 */
document.getElementById("textColor")
  .addEventListener("input", event => {
    applyCommand("foreColor", event.target.value);
  });

/* 형광펜 */
document.getElementById("highlightColor")
  .addEventListener("input", event => {
    applyCommand("hiliteColor", event.target.value);
  });

/* 텍스트 복사 */
document.getElementById("copyButton")
  .addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(
        editor.innerText
      );
      alert("글의 텍스트를 복사했어요.");
    } catch (error) {
      alert("복사하지 못했어요.");
    }
  });
</script>
</body>
</html>
