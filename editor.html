
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUNFISH — Editor</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #faf9f7;
    color: #444;
    font-family: Georgia, "Malgun Gothic", serif;
  }

  main {
    width: min(900px, 94%);
    margin: 55px auto;
  }

  h1 {
    font-weight: normal;
    font-size: 32px;
    letter-spacing: 3px;
    color: #888;
    text-align: center;
  }

  .subtitle {
    text-align: center;
    color: #aaa;
    font-size: 12px;
    margin-bottom: 35px;
  }

  .editor-box {
    background: white;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    overflow: hidden;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 14px;
    background: #f5f5f5;
    border-bottom: 1px solid #e5e5e5;
  }

  button, select, input[type="color"] {
    height: 35px;
    border: 1px solid #ddd;
    border-radius: 5px;
    background: white;
    color: #555;
    cursor: pointer;
  }

  button {
    min-width: 35px;
    padding: 0 10px;
  }

  button:hover {
    background: #eee;
  }

  select {
    padding: 0 8px;
    max-width: 150px;
  }

  input[type="color"] {
    width: 40px;
    padding: 3px;
  }

  .tool-label {
    font-size: 11px;
    color: #888;
  }

  #editor {
    min-height: 380px;
    padding: 30px;
    outline: none;
    font-size: 15px;
    line-height: 2;
    overflow-wrap: anywhere;
  }

  #editor:empty::before {
    content: "여기에 글을 작성해 보세요...";
    color: #bbb;
  }

  .bottom {
    padding: 14px;
    border-top: 1px solid #eee;
    text-align: right;
  }

  .bottom button {
    padding: 0 15px;
  }

  .notice {
    font-size: 12px;
    color: #999;
    text-align: center;
    line-height: 1.8;
    margin-top: 20px;
  }
</style>
</head>
<body>

<main>
  <h1>SUNFISH</h1>
  <p class="subtitle">WRITING EDITOR · TEST VERSION</p>

  <div class="editor-box">

    <div class="toolbar">
      <button type="button"
        data-command="bold"
        title="굵게"><b>B</b></button>

      <button type="button"
        data-command="italic"
        title="기울임"><i>I</i></button>

      <button type="button"
        data-command="underline"
        title="밑줄"><u>U</u></button>

      <button type="button"
        data-command="strikeThrough"
        title="취소선"><s>S</s></button>

      <select id="fontFamily" title="글꼴">
        <option value="">글꼴 선택</option>
        <option value="Georgia">Georgia</option>
        <option value="Arial">Arial</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Malgun Gothic">맑은 고딕</option>
        <option value="Batang">바탕</option>
        <option value="Gulim">굴림</option>
        <option value="Gungsuh">궁서</option>
      </select>

      <select id="fontSize" title="글자 크기">
        <option value="">크기</option>
        <option value="1">아주 작게</option>
        <option value="2">작게</option>
        <option value="3">보통</option>
        <option value="4">크게</option>
        <option value="5">더 크게</option>
        <option value="6">아주 크게</option>
        <option value="7">최대</option>
      </select>

      <span class="tool-label">글자색</span>
      <input type="color"
             id="textColor"
             value="#d47791"
             title="글자 색상">

      <span class="tool-label">형광펜</span>
      <input type="color"
             id="highlightColor"
             value="#fff0a8"
             title="형광펜 색상">

      <button type="button"
        data-command="removeFormat"
        title="서식 지우기">Tx</button>
    </div>

    <div id="editor"
         contenteditable="true"
         spellcheck="false">
      <p>안녕하세요. SUNFISH 편집기입니다.</p>
      <p>원하는 글자를 드래그해서 색상이나 크기를 바꿔 보세요.</p>
    </div>

    <div class="bottom">
      <button type="button" id="copyButton">
        작성한 글 복사
      </button>
    </div>

  </div>

  <p class="notice">
    현재는 편집 기능을 시험하는 페이지입니다.<br>
    GitHub 저장 및 관리자 로그인은 아직 연결되지 않았습니다.
  </p>
</main>

<script>
const editor = document.getElementById("editor");
let savedRange = null;

function saveSelection() {
  const selection = window.getSelection();

  if (!selection || !selection.rangeCount) return;

  const range = selection.getRangeAt(0);
  const ancestor = range.commonAncestorContainer;

  if (
    ancestor === editor ||
    editor.contains(ancestor)
  ) {
    savedRange = range.cloneRange();
  }
}

function restoreSelection() {
  editor.focus();

  if (!savedRange) return;

  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(savedRange);
}

function applyCommand(command, value = null) {
  restoreSelection();

  document.execCommand(
    "styleWithCSS", false, true
  );

  document.execCommand(
    command, false, value
  );

  saveSelection();
}

document.addEventListener("selectionchange", () => {
  saveSelection();
});

document.querySelectorAll("[data-command]")
  .forEach(button => {

    button.addEventListener("mousedown", event => {
      event.preventDefault();
    });

    button.addEventListener("click", () => {
      applyCommand(button.dataset.command);
    });
  });

document.getElementById("fontFamily")
  .addEventListener("change", event => {
    if (event.target.value) {
      applyCommand("fontName", event.target.value);
    }
    event.target.value = "";
  });

document.getElementById("fontSize")
  .addEventListener("change", event => {
    if (event.target.value) {
      applyCommand("fontSize", event.target.value);
    }
    event.target.value = "";
  });

document.getElementById("textColor")
  .addEventListener("input", event => {
    applyCommand("foreColor", event.target.value);
  });

document.getElementById("highlightColor")
  .addEventListener("input", event => {
    applyCommand("hiliteColor", event.target.value);
  });

document.getElementById("copyButton")
  .addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(
        editor.innerText
      );
      alert("글의 텍스트를 복사했어요.");
    } catch (error) {
      alert("복사하지 못했어요.");
    }
  });
</script>

</body>
</html>
