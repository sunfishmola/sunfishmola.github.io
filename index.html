<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#dff3ff">
<title>SUNFISH</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;800;900&display=swap');

:root{
  --ink:#426b91;
  --glass:rgba(255,255,255,.68);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  color:var(--ink);
  font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:
    radial-gradient(circle at 12% 20%,rgba(255,255,255,.95) 0 2px,transparent 3px),
    radial-gradient(circle at 82% 12%,rgba(255,255,255,.95) 0 3px,transparent 4px),
    radial-gradient(circle at 88% 72%,rgba(255,255,255,.8) 0 2px,transparent 3px),
    linear-gradient(180deg,#cceaff 0%,#eaf8ff 52%,#d9f0fb 100%);
  overflow-x:hidden;
}
body:before,body:after{
  content:"";position:fixed;z-index:-1;width:430px;height:150px;border-radius:50%;
  background:rgba(255,255,255,.38);filter:blur(5px)
}
body:before{left:-120px;bottom:5%}
body:after{right:-150px;top:20%}
.page{width:min(760px,calc(100% - 28px));min-height:100vh;margin:auto;padding:55px 0 45px}
.hero{
  text-align:center;
  margin-bottom:24px;
  position:relative;
  min-height:112px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.logo-wrap{
  position:relative;
  display:inline-block;
  z-index:3;
}
.logo{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0;
  font-family:"Nunito",sans-serif;
  font-size:clamp(52px,10.5vw,80px);
  line-height:.92;
  font-weight:900;
  letter-spacing:-.09em;
  transform:rotate(-1deg);
  filter:
    drop-shadow(0 3px 0 #fff)
    drop-shadow(0 7px 0 #77aee0)
    drop-shadow(0 11px 0 rgba(66,125,184,.25))
    drop-shadow(0 15px 16px rgba(54,108,160,.16));
}
.logo span{
  position:relative;
  display:inline-block;
  color:#fafdff;
  -webkit-text-stroke:3.5px #6b9fd6;
  paint-order:stroke fill;
  text-shadow:
    inset 0 -8px 0 #bce9ff,
    0 -1px 0 #fff;
}
.logo span::after{
  content:attr(data-letter);
  position:absolute;
  inset:0;
}
.logo .u{
  margin-right:.015em;
}
.u-star{
  position:absolute;
  left:50%;
  top:52%;
  transform:translate(-50%,-50%);
  z-index:5;
  font-style:normal;
  font-family:Arial,sans-serif;
  font-size:.27em;
  line-height:1;
  color:#66a7df;
  -webkit-text-stroke:0;
  text-shadow:0 1px 0 rgba(255,255,255,.75);
}
.logo:before{
  content:"";
  position:absolute;
  left:-13px;right:-15px;top:-11px;bottom:-15px;
  border-radius:35px;
  z-index:-2;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.95));
}
.logo span{
  background:linear-gradient(180deg,#ffffff 0%,#ffffff 45%,#e8f8ff 66%,#aee1fb 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.logo span:before{
  content:"";
  position:absolute;
  z-index:-1;
  inset:-6px -5px -7px;
  border-radius:40%;
  filter:blur(.2px);
}
.logo span:first-child{transform:rotate(-5deg) translateY(3px)}
.logo span:nth-child(2){transform:rotate(-2deg)}
.logo span:nth-child(3){transform:rotate(1deg) translateY(-2px)}
.logo span:nth-child(4){transform:rotate(2deg)}
.logo span:nth-child(5){transform:rotate(1deg) translateY(-3px)}
.logo span:nth-child(6){transform:rotate(3deg)}
.logo span:nth-child(7){transform:rotate(5deg) translateY(3px)}

.orbit{
  position:absolute;
  left:50%;
  top:50%;
  border:3px solid rgba(255,255,255,.92);
  border-left-color:transparent;
  border-right-color:transparent;
  border-radius:50%;
  pointer-events:none;
  z-index:1;
  filter:drop-shadow(0 1px 2px rgba(82,145,195,.18));
}
.orbit-one{
  width:390px;height:86px;
  transform:translate(-50%,-50%) rotate(-11deg);
}
.orbit-two{
  width:330px;height:68px;
  opacity:.72;
  transform:translate(-50%,-48%) rotate(8deg);
  border-width:2px;
}
.star{
  position:absolute;
  z-index:4;
  color:#fff;
  text-shadow:0 2px 8px #77b7e2;
  pointer-events:none;
}
.star.a{left:7%;top:17px;font-size:23px}
.star.b{right:8%;top:64px;font-size:18px}
.star.c{left:19%;bottom:3px;font-size:12px;color:#fff}

.fish{
  position:absolute;
  right:-49px;
  bottom:-5px;
  width:48px;height:40px;
  border-radius:52% 48% 48% 52%;
  background:linear-gradient(145deg,#f8fdff 5%,#d9f4ff 58%,#a9d9f3 100%);
  border:3px solid #689ed5;
  box-shadow:
    0 0 0 4px rgba(255,255,255,.9),
    0 5px 0 rgba(89,145,197,.24),
    inset 5px 6px 9px rgba(255,255,255,.8);
  transform:rotate(5deg);
}
.fish .tail{
  position:absolute;
  left:-13px;top:12px;
  width:18px;height:18px;
  background:#d8f2ff;
  border:3px solid #689ed5;
  border-radius:65% 20% 65% 20%;
  transform:rotate(45deg);
  z-index:-1;
}
.fish .eye{
  position:absolute;
  right:11px;top:10px;
  width:5px;height:5px;border-radius:50%;
  background:#5489bf;
}
.fish .fin{
  position:absolute;
  left:18px;bottom:5px;
  width:13px;height:8px;
  border-radius:50%;
  background:rgba(116,185,225,.45);
  transform:rotate(-18deg);
}

.main-card{
  display:block;position:relative;text-decoration:none;color:white;border-radius:38px;padding:28px 32px;
  background:linear-gradient(115deg,rgba(255,255,255,.40),transparent 30%),linear-gradient(145deg,#9bd8f7,#6cb6e8 58%,#82c8ef);
  border:4px solid rgba(255,255,255,.92);
  box-shadow:0 0 0 3px rgba(91,157,211,.55),inset 0 4px 12px rgba(255,255,255,.68),inset 0 -10px 20px rgba(72,143,199,.13),0 18px 30px rgba(64,127,174,.17);
  transition:.18s ease;overflow:hidden
}
.main-card:before{
  content:"";position:absolute;left:5%;right:5%;top:7px;height:40%;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));pointer-events:none
}
.main-card:hover{transform:translateY(-4px) scale(1.008)}
.badge{
  display:inline-block;position:relative;margin-bottom:7px;padding:4px 10px;border-radius:999px;
  background:rgba(255,255,255,.9);color:#5a93c4;font:900 10px/1 "Nunito",sans-serif;
  letter-spacing:.14em;box-shadow:0 2px 6px rgba(59,118,163,.12)
}
.caveduck{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px}
.cave-title{
  font-family:"Nunito",sans-serif;font-weight:900;font-size:clamp(31px,7vw,47px);letter-spacing:-.03em;
  color:#fff;-webkit-text-stroke:3px rgba(74,135,191,.72);paint-order:stroke fill;
  text-shadow:0 4px 0 rgba(69,132,186,.22)
}
.go{
  flex:0 0 auto;width:52px;height:52px;display:grid;place-items:center;border-radius:50%;
  background:rgba(255,255,255,.88);color:#679fd0;border:2px solid rgba(82,145,199,.24);
  font:900 31px/1 "Nunito",sans-serif;box-shadow:inset 0 2px 4px white,0 5px 12px rgba(58,117,165,.14)
}
.tile{
  text-decoration:none;color:var(--ink);background:var(--glass);border:2px solid rgba(255,255,255,.9);
  box-shadow:0 0 0 1px rgba(102,161,202,.25),inset 0 2px 5px white,0 8px 20px rgba(61,119,160,.09);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)
}
.info{
  margin-top:18px;border-radius:24px;padding:22px 23px;line-height:1.85;
  font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px
}
.info-title{
  font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  margin-bottom:12px;color:#5685a7;font-size:15px
}
.info p{margin:0 0 10px}.info p:last-child{margin:0}
.email{
  margin-top:13px;min-height:58px;border-radius:21px;display:flex;align-items:center;justify-content:center;
  font-family:"Nunito",sans-serif;font-weight:900;letter-spacing:.06em
}
.bottom{margin-top:13px;display:grid;grid-template-columns:1fr 1fr;gap:13px}
.site{
  min-height:58px;border-radius:21px;display:flex;align-items:center;justify-content:center;
  font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;font-weight:400;letter-spacing:0
}
.testing{opacity:.5}
.sparkline{text-align:center;margin-top:25px;color:#8ab7d2;letter-spacing:.65em;font-size:11px}
a{transition:.17s ease}
a:hover{transform:translateY(-2px);background-color:rgba(255,255,255,.82)}
@media(max-width:560px){
  .hero{min-height:95px;margin-bottom:18px}
  .orbit-one{width:285px;height:68px}
  .orbit-two{width:245px;height:54px}
  .fish{right:-34px;bottom:-2px;transform:scale(.78) rotate(5deg)}

  .page{padding:38px 0 32px}
  
  .orbit{width:270px;height:80px}
  
  
  .main-card{padding:25px 22px;border-radius:31px}
  .go{width:45px;height:45px}
  .bottom{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <div class="orbit orbit-one"></div>
    <div class="orbit orbit-two"></div>
    <span class="star a">✦</span><span class="star b">✦</span><span class="star c">★</span>
    <div class="logo-wrap">
      <div class="logo" aria-label="SUNFISH">
        <span>S</span><span class="u">U<i class="u-star">★</i></span><span>N</span><span>F</span><span>I</span><span>S</span><span>H</span>

</main>
</body>
</html>
