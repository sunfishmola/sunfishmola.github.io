<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#dff3ff">
<title>SUNFISH</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;800;900&display=swap');

:root{
  --ink:#426b91;
  --glass:rgba(255,255,255,.68);
}

*{box-sizing:border-box}

html,body{min-height:100%}

body{
  margin:0;
  color:var(--ink);
  font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:
    radial-gradient(circle at 12% 20%,rgba(255,255,255,.95) 0 2px,transparent 3px),
    radial-gradient(circle at 82% 12%,rgba(255,255,255,.95) 0 3px,transparent 4px),
    radial-gradient(circle at 88% 72%,rgba(255,255,255,.8) 0 2px,transparent 3px),
    linear-gradient(180deg,#cceaff 0%,#eaf8ff 52%,#d9f0fb 100%);
  overflow-x:hidden;
}

body:before,
body:after{
  content:"";
  position:fixed;
  z-index:-1;
  width:430px;
  height:150px;
  border-radius:50%;
  background:rgba(255,255,255,.38);
  filter:blur(5px);
}

body:before{left:-120px;bottom:5%}
body:after{right:-150px;top:20%}

.page{
  width:min(760px,calc(100% - 28px));
  min-height:100vh;
  margin:auto;
  padding:45px 0;
}

/* ---------- SUNFISH 이미지 로고 ---------- */

.hero{
  position:relative;
  min-height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  margin-bottom:14px;
}

.sunfish-logo{
  position:relative;
  z-index:3;
  display:block;
  width:min(430px,82vw);
  height:auto;
  object-fit:contain;
  filter:
    drop-shadow(0 5px 0 rgba(100,157,211,.18))
    drop-shadow(0 11px 17px rgba(65,120,170,.14));
}

/* 로고 뒤 궤도 */
.orbit{
  position:absolute;
  left:50%;
  top:50%;
  border:3px solid rgba(255,255,255,.94);
  border-left-color:transparent;
  border-right-color:transparent;
  border-radius:50%;
  pointer-events:none;
  z-index:1;
  filter:drop-shadow(0 1px 2px rgba(82,145,195,.18));
}

.orbit-one{
  width:430px;
  height:100px;
  transform:translate(-50%,-50%) rotate(-10deg);
}

.orbit-two{
  width:350px;
  height:75px;
  opacity:.62;
  border-width:2px;
  transform:translate(-50%,-50%) rotate(8deg);
}

/* 반짝이 */
.star{
  position:absolute;
  z-index:4;
  color:#fff;
  pointer-events:none;
  text-shadow:0 2px 9px #77b7e2;
  animation:twinkle 2.4s ease-in-out infinite;
}

.star.a{left:8%;top:20px;font-size:24px}
.star.b{right:8%;top:70px;font-size:18px;animation-delay:.8s}
.star.c{left:20%;bottom:7px;font-size:13px;animation-delay:1.4s}

@keyframes twinkle{
  0%,100%{opacity:.45;transform:scale(.8)}
  50%{opacity:1;transform:scale(1.18)}
}

/* ---------- 메인 CAVEDUCK ---------- */

.main-card{
  display:block;
  position:relative;
  text-decoration:none;
  color:white;
  border-radius:38px;
  padding:28px 32px;
  background:
    linear-gradient(115deg,rgba(255,255,255,.40),transparent 30%),
    linear-gradient(145deg,#9bd8f7,#6cb6e8 58%,#82c8ef);
  border:4px solid rgba(255,255,255,.92);
  box-shadow:
    0 0 0 3px rgba(91,157,211,.55),
    inset 0 4px 12px rgba(255,255,255,.68),
    inset 0 -10px 20px rgba(72,143,199,.13),
    0 18px 30px rgba(64,127,174,.17);
  transition:.18s ease;
  overflow:hidden;
}

.main-card:before{
  content:"";
  position:absolute;
  left:5%;
  right:5%;
  top:7px;
  height:40%;
  border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));
  pointer-events:none;
}

.main-card:hover{
  transform:translateY(-4px) scale(1.008);
}

.badge{
  display:inline-block;
  position:relative;
  margin-bottom:7px;
  padding:4px 10px;
  border-radius:999px;
  background:rgba(255,255,255,.9);
  color:#5a93c4;
  font:900 10px/1 "Nunito",sans-serif;
  letter-spacing:.14em;
  box-shadow:0 2px 6px rgba(59,118,163,.12);
}

.caveduck{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.cave-title{
  font-family:"Nunito",sans-serif;
  font-weight:900;
  font-size:clamp(31px,7vw,47px);
  letter-spacing:-.03em;
  color:#fff;
  -webkit-text-stroke:3px rgba(74,135,191,.72);
  paint-order:stroke fill;
  text-shadow:0 4px 0 rgba(69,132,186,.22);
}

.go{
  flex:0 0 auto;
  width:52px;
  height:52px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:rgba(255,255,255,.88);
  color:#679fd0;
  border:2px solid rgba(82,145,199,.24);
  font:900 31px/1 "Nunito",sans-serif;
  box-shadow:
    inset 0 2px 4px white,
    0 5px 12px rgba(58,117,165,.14);
}

/* ---------- 공통 패널 ---------- */

.tile{
  text-decoration:none;
  color:var(--ink);
  background:var(--glass);
  border:2px solid rgba(255,255,255,.9);
  box-shadow:
    0 0 0 1px rgba(102,161,202,.25),
    inset 0 2px 5px white,
    0 8px 20px rgba(61,119,160,.09);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.info{
  margin-top:18px;
  border-radius:24px;
  padding:22px 23px;
  line-height:1.85;
  font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px;
}

.info-title{
  font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  margin-bottom:12px;
  color:#5685a7;
  font-size:15px;
}

.info p{margin:0 0 10px}
.info p:last-child{margin:0}

/* ---------- EMAIL ---------- */

.email{
  margin-top:13px;
  min-height:58px;
  border-radius:21px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Nunito",sans-serif;
  font-weight:900;
  letter-spacing:.06em;
}

/* ---------- 하단 사이트 ---------- */

.bottom{
  margin-top:13px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.site{
  min-height:58px;
  border-radius:21px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;
  font-weight:400;
  letter-spacing:0;
}

.testing{opacity:.5}

.sparkline{
  text-align:center;
  margin-top:25px;
  color:#8ab7d2;
  letter-spacing:.65em;
  font-size:11px;
}

a{transition:.17s ease}

a:hover{
  transform:translateY(-2px);
  background-color:rgba(255,255,255,.82);
}

/* ---------- 모바일 ---------- */

@media(max-width:560px){
  .page{
    padding:30px 0;
  }

  .hero{
    min-height:115px;
    margin-bottom:10px;
  }

  .sunfish-logo{
    width:min(360px,86vw);
  }

  .orbit-one{
    width:310px;
    height:75px;
  }

  .orbit-two{
    width:255px;
    height:58px;
  }

  .main-card{
    padding:25px 22px;
    border-radius:31px;
  }

  .go{
    width:45px;
    height:45px;
  }
}
</style>
</head>

<body>
<main class="page">

  <header class="hero">
    <div class="orbit orbit-one"></div>
    <div class="orbit orbit-two"></div>

    <span class="star a">✦</span>
    <span class="star b">✦</span>
    <span class="star c">★</span>

    <img
      class="sunfish-logo"
      src="https://cdn.caveduck.io/cdn-cgi/image/dpr=1.5,f=auto,fit=crop,w=400/charim/3d76a567-fa86-40ec-b5b1-c24667e4cf01?v=8d931a"
      alt="SUNFISH"
    >
  </header>

  <a
    class="main-card"
    href="https://caveduck.io/ko/user/sunfish"
    target="_blank"
    rel="noopener noreferrer"
  >
    <span class="badge">MAIN</span>

    <div class="caveduck">
      <div class="cave-title">CAVEDUCK</div>
      <span class="go">›</span>
    </div>
  </a>

  <section class="tile info">
    <div class="info-title">✦ &nbsp; 캐릭터 이식 안내</div>

    <p>
      일라이 이전에 제작한 캐릭터는 오리지널 표시가 붙어 있더라도
      공식 크리에이터 신청 전에 제작한 캐릭터이기 때문에 이식이 가능합니다.
      원하시는 경우 편하게 문의해 주세요.
    </p>

    <p>
      다만 제가 이용해 보지 않은 사이트의 이식은 제작 방식을 따로 알아보고
      테스트하는 과정이 필요해 시간이 다소 오래 소요될 수 있습니다.
    </p>
  </section>

  <a
    class="tile email"
    href="mailto:sunfish.molamola.ocean@gmail.com"
  >
    ✉ &nbsp; EMAIL
  </a>

  <div class="bottom">

    <a
      class="tile site"
      href="https://rofan.ai/user/90a80efa-baf1-4bd6-a09d-7d90a6e4a3d1"
      target="_blank"
      rel="noopener noreferrer"
    >
      로판AI
    </a>

    <div class="tile site testing">
      테스트중
    </div>

  </div>

  <div class="sparkline">✦ · ✧ · ✦</div>

</main>
</body>
</html>
