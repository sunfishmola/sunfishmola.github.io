<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUNFISH</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap');

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  overflow-x: clip;
}

body {
  min-height: 100vh;
  background: #fff;
  color: #111;
  font-family: Georgia, "Times New Roman", serif;
}

.page {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  width: 100%;
  min-height: 100vh;
  padding: 40px 5vw;
}

.player-area {
  position: relative;
  z-index: 2;
  flex-shrink: 0;
  width: min(100%, 650px);
  min-width: 0;
  text-align: center;
}

h1 {
  position: relative;
  display: inline-block;
  margin: 0 0 8px;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 38px;
  font-weight: 300;
  line-height: 1.1;
  letter-spacing: .035em;
  color: #777;
  text-shadow:
    0 0 1px rgba(90,90,90,.25),
    0 0 4px rgba(100,100,100,.18),
    0 0 10px rgba(120,120,120,.12);
}

h1::after {
  content: attr(data-text);
  position: absolute;
  inset: 0;
  color: rgba(110,110,110,.25);
  filter: blur(2.5px);
  transform: translate(.8px,.7px);
  pointer-events: none;
}

.site-nav {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 22px;
  margin: 0 0 28px;
}

.nav-button {
  padding: 4px 0;
  border: 0;
  background: transparent;
  color: #999;
  font-family: Georgia, serif;
  font-size: 10px;
  letter-spacing: .13em;
  cursor: pointer;
  transition: color .25s ease;
}

.nav-button:hover,
.nav-button.active {
  color: #444;
}

.nav-button.active {
  border-bottom: 1px solid #aaa;
}

.turntable {
  position: relative;
  width: min(100%, 576px);
  aspect-ratio: 1.3 / 1;
  margin: 0 auto;
  user-select: none;
  -webkit-user-select: none;
}

.vinyl {
  position: absolute;
  display: block;
  width: 100%;
  height: auto;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  transform-origin: center;
  pointer-events: none;
  -webkit-user-drag: none;
}

.vinyl.playing {
  animation: spin 3s linear infinite;
}

@keyframes spin {
  from {
    transform: translate(-50%, -50%) rotate(0deg);
  }

  to {
    transform: translate(-50%, -50%) rotate(360deg);
  }
}

.tonearm {
  position: absolute;
  z-index: 2;
  width: 73%;
  height: auto;
  left: 39%;
  top: -8%;
  transform-origin: 77% 17%;
  cursor: grab;
  touch-action: none;
  -webkit-user-drag: none;
}

.tonearm.dragging {
  cursor: grabbing;
}

.content-area {
  position: fixed;
  z-index: 1;
  right: 0;
  bottom: 0;
  width: 53vw;
  height: 100vh;
  pointer-events: none;
}

.home-art {
  position: absolute;
  inset: 0;
  background-image: url("싸움.png");
  background-repeat: no-repeat;
  background-size: auto 90vh;
  background-position: calc(100% - 120px) bottom;
  opacity: 1;
  visibility: visible;
  transition:
    opacity .45s ease,
    visibility .45s ease;
}

.text-panel {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 70px 9vw 70px 5vw;
  opacity: 0;
  visibility: hidden;
  transform: translateY(8px);
  transition:
    opacity .45s ease,
    transform .45s ease,
    visibility .45s ease;
}

.text-panel-inner {
  width: 100%;
  max-width: 440px;
  max-height: 80vh;
  min-width: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  pointer-events: auto;
  scrollbar-width: thin;
  scrollbar-color: #ccc transparent;
}

.content-area[data-view="notice"] .home-art,
.content-area[data-view="characters"] .home-art {
  opacity: 0;
  visibility: hidden;
}

.content-area[data-view="notice"] .notice-panel,
.content-area[data-view="characters"] .characters-panel {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.entry-list {
  display: flex;
  flex-direction: column;
  width: 100%;
}

.entry-button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: 100%;
  min-width: 0;
  padding: 20px 2px;
  border: 0;
  border-bottom: 1px solid #e6e6e6;
  background: transparent;
  text-align: left;
  color: #666;
  font-family: Georgia, serif;
  font-size: 14px;
  overflow-wrap: anywhere;
  cursor: pointer;
  transition: color .25s ease;
}

.entry-button:hover {
  color: #222;
}

.entry-button::after {
  content: "→";
  flex-shrink: 0;
  font-size: 16px;
  color: #aaa;
}

.detail-view {
  display: none;
  width: 100%;
  min-width: 0;
}

.detail-view.active {
  display: block;
}

.list-view.hidden {
  display: none;
}

.back-button {
  display: inline-block;
  margin: 0 0 30px;
  padding: 0;
  border: 0;
  background: transparent;
  color: #999;
  font-family: Georgia, serif;
  font-size: 11px;
  cursor: pointer;
}

.back-button:hover {
  color: #444;
}

.detail-title {
  margin: 0 0 24px;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 32px;
  font-weight: 300;
  line-height: 1.4;
  color: #555;
  overflow-wrap: anywhere;
}

.detail-image {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 0 0 24px;
}

.markdown-body {
  width: 100%;
  min-width: 0;
  color: #666;
  font-size: 13px;
  line-height: 2;
  overflow-wrap: anywhere;
}

.markdown-body p {
  margin: 0 0 1.2em;
}

.markdown-body h1,
.markdown-body h2,
.markdown-body h3,
.markdown-body h4 {
  position: static;
  display: block;
  margin: 1.5em 0 .6em;
  font-family: Georgia, serif;
  font-weight: normal;
  letter-spacing: normal;
  color: #555;
  text-shadow: none;
}

.markdown-body h1::after {
  display: none;
}

.markdown-body h1 {
  font-size: 22px;
}

.markdown-body h2 {
  font-size: 19px;
}

.markdown-body h3 {
  font-size: 16px;
}

.markdown-body img,
.markdown-body video,
.markdown-body iframe {
  max-width: 100%;
}

.markdown-body img {
  display: block;
  height: auto;
  margin: 20px 0;
}

.markdown-body a {
  color: #777;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.markdown-body blockquote {
  margin: 18px 0;
  padding-left: 15px;
  border-left: 1px solid #ccc;
  color: #888;
}

.markdown-body hr {
  border: 0;
  border-top: 1px solid #e5e5e5;
  margin: 25px 0;
}

.markdown-body pre {
  max-width: 100%;
  overflow-x: auto;
  padding: 12px;
  background: #f7f7f7;
}

.markdown-body code {
  font-family: monospace;
  font-size: .9em;
}

.youtube-player-wrap {
  position: fixed;
  width: 1px;
  height: 1px;
  left: -9999px;
  top: -9999px;
  overflow: hidden;
  pointer-events: none;
}

/* HOME 업데이트 목록 */

.sunfish-updates {
  width: min(100%, 440px);
  margin: 24px auto 0;
  text-align: left;
  color: #777;
  font-family: Georgia, serif;
}

.sunfish-updates h2 {
  margin: 0 0 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid #e6e6e6;
  font-size: 14px;
  font-weight: normal;
  color: #666;
}

.sunfish-update-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 18px;
  padding: 11px 0;
  border-bottom: 1px solid #eee;
  font-size: 12px;
  line-height: 1.7;
}

.sunfish-update-text {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.sunfish-update-date {
  flex-shrink: 0;
  color: #999;
  font-size: 11px;
  white-space: nowrap;
}

/* 업데이트 목록은 HOME에만 표시 */

body[data-view="notice"] .sunfish-updates,
body[data-view="characters"] .sunfish-updates {
  display: none;
}

/* 태블릿 및 모바일 */

  }

    height: 46svh;

  }

  .text-panel {

  .text-panel-inner {

  /* 글 화면에서는 턴테이블 아래로 밀리지 않도록 */

  body[data-view="notice"] .content-area,
  body[data-view="characters"] .content-area {

    margin-top: 0;
  }

  body[data-view="notice"] .home-art,
  body[data-view="characters"] .home-art {
    display: none;
  }

  body[data-view="notice"] .text-panel,
  body[data-view="characters"] .text-panel {
    display: none;
  }

  body[data-view="notice"] .notice-panel,
  body[data-view="characters"] .characters-panel {
    position: relative;
    display: block;

  body[data-view="notice"] .notice-panel .text-panel-inner,

  body[data-view="notice"] .site-nav,

  }

@media (max-width: 700px) {
  .page {
    padding: 34px 12px 40px;
  }

  h1 {

  }

  .site-nav {
    gap: 20px;
    margin-bottom: 18px;
  }

  .nav-button {
    font-size: 9px;
  }

  .turntable {
    width: min(76vw, 380px);
  }

  .content-area {
    width: 100%;
    margin-top: 24px;
  }

  .home-art {
    height: 42svh;
  }

  .markdown-body {
    font-size: 14px;

  }

  .sunfish-updates {

  }

  .sunfish-update-row {

@media (prefers-reduced-motion: reduce) {
  .home-art,
  .text-panel {
    transition: none;
  }
}

<script>
/* SUNFISH CMS 설정 */

const GITHUB_OWNER = "sunfishmola";
const GITHUB_REPO = "sunfishmola.github.io";
const GITHUB_BRANCH = "main";

const CMS_SECTIONS = {
  characters: {
    folder: "content/characters",
    listId: "charactersEntries",
    detailId: "charactersDetail",
    titleId: "charactersTitle",
    imageId: "charactersImageArea",
    bodyId: "charactersBody"
  },

  notice: {
    folder: "content/notices",
    listId: "noticeEntries",
    detailId: "noticeDetail",
    titleId: "noticeTitle",
    imageId: "noticeImageArea",
    bodyId: "noticeBody"
  }
};

const cmsCache = {
  characters: [],
  notice: []
};

/* 마크다운 읽기 */

function parseMarkdownFile(source, fallbackTitle) {
  const normalized = source.replace(/\r\n/g, "\n");

  let metadata = {};
  let body = normalized;

  if (normalized.startsWith("---\n")) {
    const closing = normalized.indexOf("\n---", 4);

    if (closing !== -1) {
      const frontmatter = normalized.slice(4, closing);
      body = normalized.slice(closing + 4).trim();

      let currentKey = null;

      for (const line of frontmatter.split("\n")) {
        const match = line.match(/^([A-Za-z0-9_-]+):\s*(.*)$/);

        if (match) {
          currentKey = match[1];
          metadata[currentKey] = match[2].trim();
        } else if (currentKey && /^\s+\S/.test(line)) {
          metadata[currentKey] += " " + line.trim();
        }
      }
    }
  }

  for (const key of Object.keys(metadata)) {
    const value = metadata[key];

    if (
      (value.startsWith('"') && value.endsWith('"')) ||
      (value.startsWith("'") && value.endsWith("'"))
    ) {
      metadata[key] = value.slice(1, -1);
    }
  }

  return {
    title: metadata.title || fallbackTitle,
    image: metadata.image || "",
    body: body
  };
}

/* 이미지 경로 */

function encodePath(path) {
  return path
    .split("/")
    .map(part => encodeURIComponent(part))
    .join("/");
}

function resolveMediaUrl(path) {
  if (!path) return "";

  const cleaned = String(path).trim();

  if (/^https?:\/\//i.test(cleaned)) {
    return cleaned;
  }

  if (/^(data|javascript|blob):/i.test(cleaned)) {
    return "";
  }

  const root = window.location.origin;

  if (cleaned.startsWith("/")) {
    return root + encodePath(cleaned);
  }

  return root + "/" + encodePath(cleaned);
}

/* GitHub 글 목록 가져오기 */

async function loadCMSSection(sectionName) {
  const section = CMS_SECTIONS[sectionName];
  const list = document.getElementById(section.listId);

  /* 아무런 로딩 문구도 표시하지 않음 */
  list.replaceChildren();

  try {
    const apiUrl =
      "https://api.github.com/repos/" +
      GITHUB_OWNER + "/" +
      GITHUB_REPO + "/contents/" +
      section.folder +
      "?ref=" + encodeURIComponent(GITHUB_BRANCH);

    const response = await fetch(apiUrl, {
      headers: {
        Accept: "application/vnd.github+json"
      }
    });

    if (response.status === 404) {
      cmsCache[sectionName] = [];
      renderCMSList(sectionName);
      return;
    }

    if (!response.ok) {
      throw new Error("GitHub API: " + response.status);
    }

    const files = await response.json();

    if (!Array.isArray(files)) {
      throw new Error("파일 목록 형식 오류");
    }

    const markdownFiles = files
      .filter(file =>
        file.type === "file" &&
        /\.md$/i.test(file.name)
      )
      .sort((a, b) =>
        b.name.localeCompare(a.name)
      );

    if (markdownFiles.length === 0) {
      cmsCache[sectionName] = [];
      renderCMSList(sectionName);
      return;
    }

    const entries = await Promise.all(
      markdownFiles.map(async file => {
        const rawUrl =
          "https://raw.githubusercontent.com/" +
          GITHUB_OWNER + "/" +
          GITHUB_REPO + "/" +
          GITHUB_BRANCH + "/" +
          encodePath(file.path);

        const fileResponse = await fetch(rawUrl);

        if (!fileResponse.ok) {
          throw new Error("글 파일 읽기 오류");
        }

        const source = await fileResponse.text();

        return {
          ...parseMarkdownFile(
            source,
            file.name.replace(/\.md$/i, "")
          ),
          filename: file.name
        };
      })
    );

    cmsCache[sectionName] = entries;
    renderCMSList(sectionName);

  } catch (error) {
    /* 오류는 개발자 콘솔에만 기록 */
    console.error("CMS 불러오기 오류:", error);

    /* 방문자에게 안내 문구를 표시하지 않음 */
    list.replaceChildren();
  }
}

/* 글 목록 표시 */

function renderCMSList(sectionName) {
  const section = CMS_SECTIONS[sectionName];
  const list = document.getElementById(section.listId);
  const entries = cmsCache[sectionName];

  list.replaceChildren();

  /* 글이 없으면 아무것도 표시하지 않음 */
  if (entries.length === 0) {
    return;
  }

  entries.forEach((entry, index) => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "entry-button";
    button.textContent = entry.title;

    button.addEventListener("click", () => {
      openCMSDetail(sectionName, index);
    });

    list.appendChild(button);
  });
}

/* 상세 페이지 */

function openCMSDetail(sectionName, index) {
  const section = CMS_SECTIONS[sectionName];
  const entry = cmsCache[sectionName][index];

  if (!entry) return;

  const panel = document.querySelector(
    sectionName === "notice"
      ? ".notice-panel"
      : ".characters-panel"
  );

  const listView = panel.querySelector(".list-view");
  const detailView = document.getElementById(
    section.detailId
  );

  const title = document.getElementById(
    section.titleId
  );

  const imageArea = document.getElementById(
    section.imageId
  );

  const bodyArea = document.getElementById(
    section.bodyId
  );

  title.textContent = entry.title;
  imageArea.replaceChildren();

  if (entry.image) {
    const imageUrl = resolveMediaUrl(entry.image);

    if (imageUrl) {
      const img = document.createElement("img");
      img.src = imageUrl;
      img.alt = entry.title;
      img.className = "detail-image";
      img.loading = "lazy";
      img.onerror = () => img.remove();

      imageArea.appendChild(img);
    }
  }

  bodyArea.replaceChildren();

  if (window.marked && window.DOMPurify) {
    const html = marked.parse(entry.body, {
      breaks: true,
      gfm: true
    });

    const sanitized = DOMPurify.sanitize(html);

    const template = document.createElement("template");
    template.innerHTML = sanitized;

    template.content.querySelectorAll("img").forEach(img => {
      const original = img.getAttribute("src");
      const resolved = resolveMediaUrl(original);

      if (resolved) {
        img.src = resolved;
        img.loading = "lazy";
      } else {
        img.remove();
      }
    });

    template.content.querySelectorAll("a").forEach(link => {
      const href = link.getAttribute("href") || "";

      if (!/^(https?:\/\/|mailto:|\/|#)/i.test(href)) {
        link.removeAttribute("href");
      }

      link.target = "_blank";
      link.rel = "noopener noreferrer";
    });

    bodyArea.appendChild(template.content);

  } else {
    const paragraph = document.createElement("p");
    paragraph.style.whiteSpace = "pre-wrap";
    paragraph.textContent = entry.body;
    bodyArea.appendChild(paragraph);
  }

  listView.classList.add("hidden");
  detailView.classList.add("active");

  panel.querySelector(".text-panel-inner").scrollTop = 0;

  if (window.innerWidth <= 900) {
    window.scrollTo(0, 0);
  }
}

/* 턴테이블 */

const turntable = document.getElementById("turntable");
const vinyl = document.getElementById("vinyl");
const tonearm = document.getElementById("tonearm");

const PIVOT_X = .77;
const PIVOT_Y = .17;

const REST_ANGLE = -27;
const MIN_ANGLE = -27;
const MAX_ANGLE = 0;
const PLAY_THRESHOLD = -12;

let currentAngle = REST_ANGLE;
let dragging = false;

let startPointerAngle = 0;
let startTonearmAngle = REST_ANGLE;

let youtubePlayer = null;
let youtubeReady = false;
let wantsToPlay = false;

const youtubeScript = document.createElement("script");
youtubeScript.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(youtubeScript);

function onYouTubeIframeAPIReady() {
  youtubePlayer = new YT.Player("youtube-player", {
    width: 200,
    height: 200,
    videoId: "AJsvGtGgI6M",
    playerVars: {
      autoplay: 0,
      controls: 0,
      playsinline: 1,
      rel: 0
    },
    events: {
      onReady: function() {
        youtubeReady = true;

        if (wantsToPlay) {
          youtubePlayer.playVideo();
        }
      },
      onStateChange: function(event) {
        if (
          event.data === YT.PlayerState.PLAYING &&
          !wantsToPlay
        ) {
          youtubePlayer.pauseVideo();
        }
      }
    }
  });
}

function syncMusic(playing) {
  wantsToPlay = playing;

  if (!youtubeReady || !youtubePlayer) {
    return;
  }

  if (playing) {
    youtubePlayer.playVideo();
  } else {
    youtubePlayer.pauseVideo();
  }
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function updateTonearm(angle) {
  currentAngle = clamp(angle, MIN_ANGLE, MAX_ANGLE);

  tonearm.style.transform =
    `rotate(${currentAngle}deg)`;

  const playing = currentAngle >= PLAY_THRESHOLD;

  vinyl.classList.toggle("playing", playing);

  if (playing !== wantsToPlay) {
    syncMusic(playing);
  }
}

function getPivotPosition() {
  const rect = turntable.getBoundingClientRect();

  const imageLeft = rect.left + rect.width * .39;
  const imageTop = rect.top - rect.height * .08;
  const imageWidth = rect.width * .73;
  const imageHeight = imageWidth;

  return {
    x: imageLeft + imageWidth * PIVOT_X,
    y: imageTop + imageHeight * PIVOT_Y
  };
}

function getPointerAngle(event) {
  const pivot = getPivotPosition();

  return Math.atan2(
    event.clientY - pivot.y,
    event.clientX - pivot.x
  ) * 180 / Math.PI;
}

tonearm.addEventListener("pointerdown", event => {
  dragging = true;

  startPointerAngle = getPointerAngle(event);
  startTonearmAngle = currentAngle;

  tonearm.classList.add("dragging");
  tonearm.setPointerCapture(event.pointerId);

  event.preventDefault();
});

tonearm.addEventListener("pointermove", event => {
  if (!dragging) return;

  const pointerAngle = getPointerAngle(event);

  let difference = pointerAngle - startPointerAngle;

  if (difference > 180) difference -= 360;
  if (difference < -180) difference += 360;

  updateTonearm(startTonearmAngle + difference);
});

function endDrag() {
  dragging = false;
  tonearm.classList.remove("dragging");
}

tonearm.addEventListener("pointerup", endDrag);
tonearm.addEventListener("pointercancel", endDrag);
tonearm.addEventListener("lostpointercapture", endDrag);

updateTonearm(REST_ANGLE);

/* HOME 업데이트 목록 */

async function loadSunfishUpdates() {
  const container = document.getElementById(
    "sunfishUpdatesList"
  );

  if (!container) return;

  /* 제목은 유지하고 내용만 비움 */
  container.replaceChildren();

  try {
    const apiUrl =
      "https://api.github.com/repos/" +
      GITHUB_OWNER + "/" +
      GITHUB_REPO +
      "/contents/content/updates?ref=" +
      encodeURIComponent(GITHUB_BRANCH);

    const response = await fetch(apiUrl, {
      headers: {
        Accept: "application/vnd.github+json"
      }
    });

    /* 폴더가 없으면 아무것도 표시하지 않음 */
    if (response.status === 404) {
      return;
    }

    if (!response.ok) {
      throw new Error(
        "업데이트 목록 오류: " + response.status
      );
    }

    const result = await response.json();

    if (!Array.isArray(result)) {
      throw new Error("업데이트 목록 형식 오류");
    }

    const files = result.filter(file =>
      file.type === "file" &&
      /\.json$/i.test(file.name)
    );

    if (files.length === 0) {
      return;
    }

    const items = await Promise.all(
      files.map(async file => {
        const rawUrl =
          "https://raw.githubusercontent.com/" +
          GITHUB_OWNER + "/" +
          GITHUB_REPO + "/" +
          GITHUB_BRANCH + "/" +
          encodePath(file.path);

        const fileResponse = await fetch(rawUrl);

        if (!fileResponse.ok) {
          throw new Error("업데이트 파일 읽기 오류");
        }

        return await fileResponse.json();
      })
    );

    items.sort((a, b) =>
      String(b.createdAt || b.date || "")
        .localeCompare(
          String(a.createdAt || a.date || "")
        )
    );

    container.replaceChildren();

    /* 업데이트가 없으면 제목 아래만 비움 */
    if (items.length === 0) {
      return;
    }

    for (const item of items) {
      const row = document.createElement("div");
      row.className = "sunfish-update-row";

      const content = document.createElement("span");
      content.className = "sunfish-update-text";
      content.textContent = String(item.text || "");

      const date = document.createElement("span");
      date.className = "sunfish-update-date";
      date.textContent = String(item.date || "");

      row.append(content, date);
      container.appendChild(row);
    }

  } catch (error) {
    /* 오류 문구를 화면에 표시하지 않음 */
    console.error("업데이트 목록 오류:", error);
    container.replaceChildren();
  }
}

loadSunfishUpdates();
