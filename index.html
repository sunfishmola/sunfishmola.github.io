<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SUNFISH</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Pinyon+Script&family=Noto+Serif+KR:wght@300;400&display=swap');

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  background: #fff;
  color: #111;
  font-family: Georgia, "Times New Roman", "Noto Serif KR", serif;
}

.page {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  width: 100%;
  min-height: 100vh;
  padding: 40px 5vw;
}

.player-area {
  position: relative;
  z-index: 2;
  width: min(100%, 650px);
  min-width: 0;
  flex-shrink: 0;
  text-align: center;
}

h1 {
  position: relative;
  display: inline-block;
  margin: 0 0 4px;
  font-family: "Pinyon Script", "Snell Roundhand", cursive;
  font-size: 68px;
  font-weight: 400;
  line-height: 1.15;
  letter-spacing: 0;
  color: #6f6f6f;
  text-shadow:
    0 0 1px rgba(70,70,70,.30),
    0 0 6px rgba(90,90,90,.22),
    0 0 16px rgba(110,110,110,.16);
}

/* 뒤쪽 번짐 효과 */
h1::after {
  content: attr(data-text);
  position: absolute;
  inset: 0;
  color: rgba(100,100,100,.35);
  filter: blur(5px);
  transform: translate(1.5px,2px);
  pointer-events: none;
}

.site-nav {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 22px;
  margin: 0 0 28px;
}

.nav-button {
  padding: 4px 0;
  border: 0;
  border-bottom: 1px solid transparent;
  background: transparent;
  color: #888;
  font-family: Georgia, "Noto Serif KR", serif;
  font-size: 12px;
  letter-spacing: .14em;
  cursor: pointer;
  transition: color .25s ease;
}

.nav-button:hover,
.nav-button.active { color: #333; }

.nav-button.active { border-bottom-color: #aaa; }

.turntable {
  position: relative;
  width: min(100%, 576px);
  aspect-ratio: 1.3 / 1;
  margin: 0 auto;
  user-select: none;
  -webkit-user-select: none;
}

.vinyl {
  position: absolute;
  display: block;
  width: 100%;
  height: auto;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  transform-origin: center;
  pointer-events: none;
  -webkit-user-drag: none;
}

.vinyl.playing { animation: spin 3s linear infinite; }

@keyframes spin {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

.tonearm {
  position: absolute;
  z-index: 2;
  width: 73%;
  height: auto;
  left: 39%;
  top: -8%;
  transform-origin: 77% 17%;
  cursor: grab;
  touch-action: none;
  -webkit-user-drag: none;
}

.tonearm.dragging { cursor: grabbing; }

.audio-wave {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: 54px;
  margin: 4px auto 0;
}

.audio-wave .bar {
  display: block;
  width: 5px;
  height: var(--height);
  border-radius: 999px;
  background: #777;
  opacity: .65;
  box-shadow: 0 0 5px rgba(110,110,110,.15);
  transform-origin: center;
  animation: waveMove var(--duration) ease-in-out infinite alternate;
  animation-play-state: paused;
}

.audio-wave.playing .bar { animation-play-state: running; }

@keyframes waveMove {
  from { transform: scaleY(.3); }
  to { transform: scaleY(1.25); }
}

.content-area {
  position: fixed;
  z-index: 1;
  right: 0;
  bottom: 0;
  width: 53vw;
  height: 100vh;
  pointer-events: none;
}

.home-art {
  position: absolute;
  /* 위 10% 비우고, 오른쪽 120px 띄운 칸 안에 그림 전체가 들어가게 맞춤 */
  inset: 10vh 120px 0 0;
  background-image: url("겨울.png");
  background-repeat: no-repeat;
  background-size: contain;
  background-position: right bottom;
  opacity: 1;
  visibility: visible;
  transition: opacity .45s ease, visibility .45s ease;
}

.text-panel {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 70px 9vw 70px 5vw;
  opacity: 0;
  visibility: hidden;
  transform: translateY(8px);
  transition: opacity .45s ease, transform .45s ease, visibility .45s ease;
}

.text-panel-inner {
  width: 100%;
  max-width: 660px;
  padding-right: 18px;
  max-height: 80vh;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  pointer-events: auto;
  scrollbar-width: thin;
  scrollbar-color: #ccc transparent;
}

.content-area[data-view="notice"] .home-art,
.content-area[data-view="characters"] .home-art {
  opacity: 0;
  visibility: hidden;
}

.content-area[data-view="notice"] .notice-panel,
.content-area[data-view="characters"] .characters-panel {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.entry-list { display: flex; flex-direction: column; }

.entry-button {

  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: 100%;
  padding: 20px 2px;
  border: 0;
  border-bottom: 1px solid #e6e6e6;
  background: transparent;
  text-align: left;
  color: #666;
  font-family: Georgia, "Noto Serif KR", serif;
  font-size: 14px;
  overflow-wrap: anywhere;
  cursor: pointer;
  transition: color .25s ease;
}

.entry-button:hover { color: #222; }

.entry-button::after {
  content: "→";
  flex-shrink: 0;
  font-size: 16px;

}

.detail-view { display: none; }
.detail-view.active { display: block; }
.list-view.hidden { display: none; }

.back-button {
  display: inline-block;
  margin: 0 0 30px;
  padding: 0;
  border: 0;
  background: transparent;
  color: #999;
  font-family: Georgia, "Noto Serif KR", serif;
  font-size: 11px;
  cursor: pointer;
}

.back-button:hover { color: #444; }

.detail-title {

.detail-image {

.markdown-body {

.markdown-body h1::after { content: none; }

.markdown-body img {

.markdown-body a {

  text-decoration: underline;

.markdown-body ul,
.markdown-body ol {

.markdown-body blockquote {

  padding-left: 16px;

  color: #888;
}

.markdown-body hr {
  margin: 28px 0;
  border: 0;
  border-top: 1px solid #e6e6e6;
}

.markdown-body pre {

  padding: 12px;

  font-size: 12px;

}

.markdown-body code { overflow-wrap: anywhere; }

.markdown-body table {

.markdown-body th,

  width: 100%;

<script>
/* ========================================
   기본 설정
======================================== */

const GITHUB_OWNER = "sunfishmola";
const GITHUB_REPO = "sunfishmola.github.io";
const GITHUB_BRANCH = "main";

const CMS_SECTIONS = {
  notice: {
    folder: "content/notices",
    listId: "noticeEntries",
    detailId: "noticeDetail",
    titleId: "noticeTitle",
    imageId: "noticeImageArea",
    bodyId: "noticeBody"
  },

  characters: {
    folder: "content/characters",
    listId: "charactersEntries",
    detailId: "charactersDetail",
    titleId: "charactersTitle",
    imageId: "charactersImageArea",
    bodyId: "charactersBody"
  }
};

const cmsCache = {
  notice: [],
  characters: []
};

/* ========================================
   경로 처리
======================================== */

function encodePath(path) {
  return String(path)
    .split("/")
    .map(part => encodeURIComponent(part))
    .join("/");
}

function resolveMediaUrl(path) {
  if (!path) return "";

  const cleaned = String(path).trim();

  if (/^https?:\/\//i.test(cleaned)) return cleaned;
  if (/^(data|javascript|blob):/i.test(cleaned)) return "";

  const root = window.location.origin;

  if (cleaned.startsWith("/")) return root + encodePath(cleaned);

  return root + "/" + encodePath(cleaned);
}

/* ========================================
   Markdown 파일 읽기
======================================== */

function parseMarkdownFile(source, fallbackTitle) {
  const normalized = String(source).replace(/\r\n/g, "\n");

  let metadata = {};
  let body = normalized;

  if (normalized.startsWith("---\n")) {
    const closing = normalized.indexOf("\n---", 4);

    if (closing !== -1) {
      const frontmatter = normalized.slice(4, closing);
      body = normalized.slice(closing + 4).trim();

      let currentKey = null;

      for (const line of frontmatter.split("\n")) {
        const match = line.match(/^([A-Za-z0-9_-]+):\s*(.*)$/);

        if (match) {
          currentKey = match[1];
          metadata[currentKey] = match[2].trim();
        } else if (currentKey && /^\s+\S/.test(line)) {
          metadata[currentKey] += " " + line.trim();
        }
      }
    }
  }

  for (const key of Object.keys(metadata)) {
    const value = metadata[key];

    if (
      (value.startsWith('"') && value.endsWith('"')) ||
      (value.startsWith("'") && value.endsWith("'"))
    ) {
      metadata[key] = value.slice(1, -1);
    }
  }

  return {
    title: metadata.title || fallbackTitle,
    image: metadata.image || "",
    body
  };
}

/* ========================================
   ★ 새로 추가: catalog.json 읽기
   에디터가 글을 저장할 때마다 만들어주는 파일.
   이게 있으면 GitHub API를 거의 안 써도 됨.
======================================== */

let catalogPromise = null;

function getCatalog() {
  if (catalogPromise) return catalogPromise;

  catalogPromise = (async () => {
    const t = Date.now();

    const urls = [
      `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/content/catalog.json?t=${t}`,
      `${window.location.origin}/content/catalog.json?t=${t}`
    ];

    for (const url of urls) {
      try {
        const response = await fetch(url, { cache: "no-store" });

        if (response.ok) {
          return await response.json();
        }
      } catch (error) {
        console.warn("catalog 읽기 실패:", url, error);
      }
    }

    return null;
  })();

  return catalogPromise;
}

/* ========================================
   공개 파일 목록 가져오기 (예비 방법)
======================================== */

let publicPathsPromise = null;

async function getPublicPaths() {
  if (publicPathsPromise) return publicPathsPromise;

  publicPathsPromise = (async () => {
    const urls = [
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`,
      `https://data.jsdelivr.com/v1/package/gh/${GITHUB_OWNER}/${GITHUB_REPO}@${GITHUB_BRANCH}/flat`
    ];

    const errors = [];

    for (const url of urls) {
      try {
        const response = await fetch(url, { cache: "no-store" });

        if (!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        let paths = [];

        if (Array.isArray(data.tree) && !data.truncated) {
          paths = data.tree
            .filter(file => file.type === "blob")
            .map(file => file.path);
        } else if (Array.isArray(data.files)) {
          paths = data.files.map(file => file.name.replace(/^\//, ""));
        }

        if (paths.some(path => path.startsWith("content/"))) {
          return paths;
        }

        errors.push("목록에 content 폴더 없음");
      } catch (error) {
        errors.push(error.message);
      }
    }

    throw new Error("공개 파일 목록을 가져오지 못했습니다: " + errors.join(", "));
  })();

  try {
    return await publicPathsPromise;
  } catch (error) {
    publicPathsPromise = null;
    throw error;
  }
}

async function listPublicFiles(folder, extension) {
  const apiUrl =
    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}` +
    `/contents/${folder}?ref=${GITHUB_BRANCH}`;

  try {
    const response = await fetch(apiUrl, {
      headers: { Accept: "application/vnd.github+json" },
      cache: "no-store"
    });

    if (response.ok) {
      const data = await response.json();

      if (Array.isArray(data)) {
        return data
          .filter(file =>
            file.type === "file" &&
            file.name.toLowerCase().endsWith(extension)
          )
          .map(file => file.path);
      }
    }
  } catch (error) {
    console.warn("GitHub Contents API 실패:", error);
  }

  const paths = await getPublicPaths();

  return paths.filter(path =>
    path.startsWith(folder + "/") &&
    !path.slice(folder.length + 1).includes("/") &&
    path.toLowerCase().endsWith(extension)
  );
}

async function fetchPublicText(path) {
  const encoded = encodePath(path);

  const urls = [
    `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${encoded}`,
    `${window.location.origin}/${encoded}`,
    `https://cdn.jsdelivr.net/gh/${GITHUB_OWNER}/${GITHUB_REPO}@${GITHUB_BRANCH}/${encoded}`
  ];

  const errors = [];

  for (const url of urls) {
    try {
      const response = await fetch(url, { cache: "no-store" });

      if (!response.ok) throw new Error("HTTP " + response.status);

      return await response.text();
    } catch (error) {
      errors.push(error.message);
    }
  }

  throw new Error("글 파일 읽기 실패: " + path + " / " + errors.join(", "));
}

/* ========================================
   NOTICE / CHARACTERS 불러오기
   1순위: catalog.json (글이 있을 때)
   2순위: 기존 방식
======================================== */

async function loadCMSSection(sectionName) {
  const section = CMS_SECTIONS[sectionName];
  const list = document.getElementById(section.listId);

  list.replaceChildren();

  try {
    /* ★ catalog.json 먼저 */
    const catalog = await getCatalog();

    if (
      catalog &&
      Array.isArray(catalog[sectionName]) &&
      catalog[sectionName].length > 0
    ) {
      cmsCache[sectionName] = catalog[sectionName].map(item => ({
        title: item.title || item.filename || "제목 없음",
        image: "",
        body: item.body || item.html || "",
        filename: item.filename
      }));

      renderCMSList(sectionName);
      return;
    }

    /* 기존 방식 */
    const paths = (
      await listPublicFiles(section.folder, ".md")
    ).sort((a, b) => b.localeCompare(a));

    const results = await Promise.allSettled(
      paths.map(async path => {
        const source = await fetchPublicText(path);

        return {
          ...parseMarkdownFile(
            source,
            path.split("/").pop().replace(/\.md$/i, "")
          ),
          filename: path.split("/").pop()
        };
      })
    );

    const entries = results
      .filter(result => result.status === "fulfilled")
      .map(result => result.value);

    results
      .filter(result => result.status === "rejected")
      .forEach(result => console.error("개별 게시글 오류:", result.reason));

    cmsCache[sectionName] = entries;

    renderCMSList(sectionName);
  } catch (error) {
    console.error(sectionName + " 목록을 불러오지 못했습니다:", error);
    list.replaceChildren();
  }
}

/* ========================================
   목록 표시
======================================== */

function renderCMSList(sectionName) {
  const section = CMS_SECTIONS[sectionName];
  const list = document.getElementById(section.listId);
  const entries = cmsCache[sectionName];

  list.replaceChildren();

  entries.forEach((entry, index) => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "entry-button";
    button.textContent = entry.title;

    button.addEventListener("click", () => {
      openCMSDetail(sectionName, index);
    });

    list.appendChild(button);
  });
}

/* ========================================
   상세 글 표시
======================================== */

function openCMSDetail(sectionName, index) {
  const section = CMS_SECTIONS[sectionName];
  const entry = cmsCache[sectionName][index];

  if (!entry) return;

  const panel = document.querySelector(
    sectionName === "notice" ? ".notice-panel" : ".characters-panel"
  );

  const listView = panel.querySelector(".list-view");
  const detailView = document.getElementById(section.detailId);
  const title = document.getElementById(section.titleId);
  const imageArea = document.getElementById(section.imageId);
  const bodyArea = document.getElementById(section.bodyId);

  title.textContent = entry.title;

  imageArea.replaceChildren();

  if (entry.image) {
    const imageUrl = resolveMediaUrl(entry.image);

    if (imageUrl) {
      const img = document.createElement("img");

      img.src = imageUrl;
      img.alt = entry.title;
      img.className = "detail-image";
      img.loading = "lazy";
      img.onerror = () => img.remove();

      imageArea.appendChild(img);
    }
  }

  bodyArea.replaceChildren();

  if (window.marked && window.DOMPurify) {
    const html = marked.parse(entry.body, { breaks: true, gfm: true });

    const sanitized = DOMPurify.sanitize(html);
    const template = document.createElement("template");

    template.innerHTML = sanitized;

    template.content.querySelectorAll("img").forEach(img => {
      const original = img.getAttribute("src");
      const resolved = resolveMediaUrl(original);

      if (resolved) {
        img.src = resolved;
        img.loading = "lazy";
      } else {
        img.remove();
      }
    });

    template.content.querySelectorAll("a").forEach(link => {
      const href = link.getAttribute("href") || "";

      if (!/^(https?:\/\/|mailto:|\/|#)/i.test(href)) {
        link.removeAttribute("href");
      }

      link.target = "_blank";
      link.rel = "noopener noreferrer";
    });

    bodyArea.appendChild(template.content);
  } else {
    const paragraph = document.createElement("p");

    paragraph.style.whiteSpace = "pre-wrap";
    paragraph.textContent = entry.body;

    bodyArea.appendChild(paragraph);
  }

  listView.classList.add("hidden");
  detailView.classList.add("active");

  panel.querySelector(".text-panel-inner").scrollTop = 0;
}

/* ========================================
   목록으로 돌아가기
======================================== */

function resetCMSDetail(sectionName) {
  const panel = document.querySelector(
    sectionName === "notice" ? ".notice-panel" : ".characters-panel"
  );

  panel.querySelector(".detail-view").classList.remove("active");
  panel.querySelector(".list-view").classList.remove("hidden");
  panel.querySelector(".text-panel-inner").scrollTop = 0;
}

document.querySelectorAll("[data-back]").forEach(button => {
  button.addEventListener("click", () => {
    resetCMSDetail(button.dataset.back);
  });
});

/* ========================================
   상단 메뉴 전환
======================================== */

const contentArea = document.getElementById("contentArea");
const navButtons = document.querySelectorAll(".nav-button");

navButtons.forEach(button => {
  button.addEventListener("click", () => {
    const target = button.dataset.target;

    contentArea.dataset.view = target;
    document.body.dataset.view = target;

    navButtons.forEach(navButton => {
      const active = navButton === button;

      navButton.classList.toggle("active", active);
      navButton.setAttribute("aria-pressed", String(active));
    });

    if (target === "notice" || target === "characters") {
      resetCMSDetail(target);
    }
  });
});

/* ========================================
   게시글 로딩 시작
======================================== */

loadCMSSection("notice");
loadCMSSection("characters");

/* ========================================
   턴테이블 / 음악
======================================== */

const turntable = document.getElementById("turntable");
const vinyl = document.getElementById("vinyl");
const tonearm = document.getElementById("tonearm");
const audioWave = document.getElementById("audioWave");

const PIVOT_X = .77;
const PIVOT_Y = .17;

const REST_ANGLE = -27;
const MIN_ANGLE = -27;
const MAX_ANGLE = 0;
const PLAY_THRESHOLD = -12;

let currentAngle = REST_ANGLE;
let dragging = false;

let startPointerAngle = 0;
let startTonearmAngle = REST_ANGLE;

let youtubePlayer = null;
let youtubeReady = false;
let wantsToPlay = false;

const youtubeScript = document.createElement("script");
youtubeScript.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(youtubeScript);

function onYouTubeIframeAPIReady() {
  youtubePlayer = new YT.Player("youtube-player", {
    width: 200,
    height: 200,
    videoId: "AJsvGtGgI6M",
    playerVars: {
      autoplay: 0,
      controls: 0,
      playsinline: 1,
      rel: 0
    },
    events: {
      onReady: function() {
        youtubeReady = true;

        if (wantsToPlay) {
          youtubePlayer.playVideo();
        }
      },
      onStateChange: function(event) {
        if (event.data === YT.PlayerState.PLAYING && !wantsToPlay) {
          youtubePlayer.pauseVideo();
        }
      }
    }
  });
}

function syncMusic(playing) {
  wantsToPlay = playing;

  if (!youtubeReady || !youtubePlayer) return;

  if (playing) {
    youtubePlayer.playVideo();
  } else {
    youtubePlayer.pauseVideo();
  }
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function updateTonearm(angle) {
  currentAngle = clamp(angle, MIN_ANGLE, MAX_ANGLE);

  tonearm.style.transform = `rotate(${currentAngle}deg)`;

  const playing = currentAngle >= PLAY_THRESHOLD;

  vinyl.classList.toggle("playing", playing);

  audioWave?.classList.toggle("playing", playing);

  audioWave?.setAttribute("aria-label", playing ? "Playing" : "Stopped");

  if (playing !== wantsToPlay) {
    syncMusic(playing);
  }
}

function getPivotPosition() {
  const rect = turntable.getBoundingClientRect();

  const imageLeft = rect.left + rect.width * .39;
  const imageTop = rect.top - rect.height * .08;
  const imageWidth = rect.width * .73;
  const imageHeight = imageWidth;

  return {
    x: imageLeft + imageWidth * PIVOT_X,
    y: imageTop + imageHeight * PIVOT_Y
  };
}

function getPointerAngle(event) {
  const pivot = getPivotPosition();

  return Math.atan2(
    event.clientY - pivot.y,
    event.clientX - pivot.x
  ) * 180 / Math.PI;
}

tonearm.addEventListener("pointerdown", event => {
  dragging = true;

  startPointerAngle = getPointerAngle(event);
  startTonearmAngle = currentAngle;

  tonearm.classList.add("dragging");
  tonearm.setPointerCapture(event.pointerId);

  event.preventDefault();
});

tonearm.addEventListener("pointermove", event => {
  if (!dragging) return;

  const pointerAngle = getPointerAngle(event);

  let difference = pointerAngle - startPointerAngle;

  if (difference > 180) difference -= 360;
  if (difference < -180) difference += 360;

  updateTonearm(startTonearmAngle + difference);
});

function endDrag() {
  dragging = false;
  tonearm.classList.remove("dragging");
}

tonearm.addEventListener("pointerup", endDrag);
tonearm.addEventListener("pointercancel", endDrag);
tonearm.addEventListener("lostpointercapture", endDrag);

updateTonearm(REST_ANGLE);

/* ========================================
   HOME 업데이트 목록
======================================== */

function addUpdateRow(container, item) {
  const row = document.createElement("div");
  row.className = "sunfish-update-row";

  const content = document.createElement("span");
  content.className = "sunfish-update-text";
  content.textContent = String(item.text || item.content || "");

  const date = document.createElement("span");
  date.className = "sunfish-update-date";
  date.textContent = String(item.date || "");

  row.append(content, date);
  container.appendChild(row);
}

async function loadSunfishUpdates() {
  const container = document.getElementById("sunfishUpdatesList");

  if (!container) return;

  container.replaceChildren();

  try {
    /* ★ catalog.json 먼저 */
    const catalog = await getCatalog();

    if (
      catalog &&
      Array.isArray(catalog.updates) &&
      catalog.updates.length > 0
    ) {
      for (const item of catalog.updates) {
        addUpdateRow(container, item);
      }
      return;
    }

    /* 기존 방식 */
    const paths = await listPublicFiles("content/updates", ".json");

    const results = await Promise.allSettled(
      paths.map(async path => {
        const text = await fetchPublicText(path);
        return JSON.parse(text);
      })
    );

    const items = results
      .filter(result => result.status === "fulfilled")
      .map(result => result.value);

    results
      .filter(result => result.status === "rejected")
      .forEach(result => console.error("개별 업데이트 오류:", result.reason));

    items.sort((a, b) =>
      String(b.createdAt || b.date || "")
        .localeCompare(String(a.createdAt || a.date || ""))
    );

    for (const item of items) {
      addUpdateRow(container, item);
    }
  } catch (error) {
    console.error("업데이트 목록 조회 실패:", error);
    container.replaceChildren();
  }
}

loadSunfishUpdates();
/* ========================================
   눈 내리는 배경
   - 쌓이지 않고 아래로 사라지면 위에서 다시 내려옴
   - 모션 줄이기 설정이면 표시 안 함
======================================== */

(function () {
  const canvas = document.getElementById("snow");

  if (!canvas) return;

  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    canvas.remove();
    return;
  }

  const ctx = canvas.getContext("2d");

  /* 눈 색: 연회색 / 연하늘색 (r,g,b) */
  const COLORS = ["175,175,182", "160,190,215", "185,205,225"];

  let w = 0;
  let h = 0;
  let flakes = [];

  function makeFlake(randomY) {
    const r = 1 + Math.random() * 2.6;

    return {
      x: Math.random() * w,
      y: randomY ? Math.random() * h : -10,
      r,
      vy: .25 + r * .22,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: .004 + Math.random() * .01,
      swayAmount: .15 + Math.random() * .35,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      alpha: .3 + Math.random() * .35
    };
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    w = window.innerWidth;
    h = window.innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const count = Math.round(
      Math.min(110, Math.max(35, (w * h) / 16000))
    );

    flakes = Array.from({ length: count }, () => makeFlake(true));
  }

  function frame() {
    ctx.clearRect(0, 0, w, h);

    for (const f of flakes) {
      f.sway += f.swaySpeed;
      f.x += Math.sin(f.sway) * f.swayAmount;
      f.y += f.vy;

      if (f.y > h + 10) {
        Object.assign(f, makeFlake(false));
      }

      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${f.color},${f.alpha})`;
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);

  resize();
  requestAnimationFrame(frame);
})();
