
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>SUNFISH — Turntable Test</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap');

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  width: 100%;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  background: #fff;
  color: #111;
  font-family: Georgia, "Times New Roman", serif;
}

.page {
  position: relative;
  min-height: 100vh;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding: 40px 5vw;
}

.player-area {
  position: relative;
  z-index: 2;
  width: min(100%, 650px);
  text-align: center;
  flex-shrink: 0;
}

/* SUNFISH */
h1 {
  position: relative;
  display: inline-block;
  margin: 0 0 8px;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 38px;
  font-weight: 300;
  line-height: 1.1;
  letter-spacing: .035em;
  color: #777;
  text-shadow:
    0 0 1px rgba(90,90,90,.25),
    0 0 4px rgba(100,100,100,.18),
    0 0 10px rgba(120,120,120,.12);
}

h1::after {
  content: attr(data-text);
  position: absolute;
  inset: 0;
  color: rgba(110,110,110,.25);
  filter: blur(2.5px);
  transform: translate(.8px,.7px);
  pointer-events: none;
}

/* 메뉴 */
.site-nav {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 22px;
  margin: 0 0 28px;
}

.nav-button {
  padding: 4px 0;
  border: 0;
  background: transparent;
  color: #999;
  font-family: Georgia, serif;
  font-size: 10px;
  letter-spacing: .13em;
  cursor: pointer;
  transition: color .25s ease;
}

.nav-button:hover,
.nav-button.active {
  color: #444;
}

.nav-button.active {
  border-bottom: 1px solid #aaa;
}

/* 턴테이블 */
.turntable {
  position: relative;
  width: min(100%, 576px);
  aspect-ratio: 1.3 / 1;
  margin: 0 auto;
  user-select: none;
  -webkit-user-select: none;
}

.vinyl {
  position: absolute;
  display: block;
  width: 100%;
  height: auto;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  transform-origin: center;
  pointer-events: none;
  -webkit-user-drag: none;
}

.vinyl.playing {
  animation: spin 3s linear infinite;
}

@keyframes spin {
  from {
    transform: translate(-50%,-50%) rotate(0deg);
  }
  to {
    transform: translate(-50%,-50%) rotate(360deg);
  }
}

.tonearm {
  position: absolute;
  z-index: 2;
  width: 73%;
  height: auto;
  left: 39%;
  top: -8%;
  transform-origin: 77% 17%;
  cursor: grab;
  touch-action: none;
  -webkit-user-drag: none;
}

.tonearm.dragging {
  cursor: grabbing;
}

.instructions {
  margin: 18px 0 0;
  font-size: 12px;
  line-height: 1.8;
  color: #444;
}

/* 오디오 파형 */
.audio-wave {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: 54px;
  margin: 4px auto 0;
}

.audio-wave .bar {
  display: block;
  width: 5px;
  height: var(--height);
  border-radius: 999px;
  background: #777;
  opacity: .65;
  box-shadow: 0 0 5px rgba(110,110,110,.15);
  transform-origin: center;
  animation: waveMove var(--duration)
    ease-in-out infinite alternate;
  animation-play-state: paused;
}

.audio-wave.playing .bar {
  animation-play-state: running;
}

@keyframes waveMove {
  from { transform: scaleY(.3); }
  to { transform: scaleY(1.25); }
}

/* 오른쪽 콘텐츠 */
.content-area {
  position: fixed;
  z-index: 1;
  right: 0;
  bottom: 0;
  width: 53vw;
  height: 100vh;
  pointer-events: none;
}

.home-art {
  position: absolute;
  inset: 0;
  background-image: url("싸움.png");
  background-repeat: no-repeat;
  background-size: auto 90vh;
  background-position: calc(100% - 120px) bottom;
  opacity: 1;
  visibility: visible;
  transition:
    opacity .45s ease,
    visibility .45s ease;
}

.text-panel {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 70px 9vw 70px 5vw;
  opacity: 0;
  visibility: hidden;
  transform: translateY(8px);
  transition:
    opacity .45s ease,
    transform .45s ease,
    visibility .45s ease;
}

.text-panel-inner {
  width: 100%;
  max-width: 440px;
  max-height: 80vh;
  overflow-y: auto;
  overscroll-behavior: contain;
  pointer-events: auto;
  scrollbar-width: thin;
  scrollbar-color: #ccc transparent;
}

.content-area[data-view="notice"] .home-art,
.content-area[data-view="characters"] .home-art {
  opacity: 0;
  visibility: hidden;
}

.content-area[data-view="notice"] .notice-panel,
.content-area[data-view="characters"] .characters-panel {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

/* CMS 목록 */
.entry-list {

}

.entry-button {

}

.entry-button:hover {

}

.entry-button::after {

.cms-message {

.retry-button {

/* 상세 글 */
.detail-view {

}

.detail-view.active {

}

.list-view.hidden {

.back-button {

.back-button:hover {

.detail-title {

<script>
/* ========================================
   SUNFISH CMS 연결 설정
======================================== */

const GITHUB_OWNER = "sunfishmola";
const GITHUB_REPO = "sunfishmola.github.io";
const GITHUB_BRANCH = "main";

const CMS_SECTIONS = {
  characters: {
    folder: "content/characters",
    listId: "charactersEntries",
    detailId: "charactersDetail",
    titleId: "charactersTitle",
    imageId: "charactersImageArea",
    bodyId: "charactersBody"
  },
  notice: {
    folder: "content/notices",
    listId: "noticeEntries",
    detailId: "noticeDetail",
    titleId: "noticeTitle",
    imageId: "noticeImageArea",
    bodyId: "noticeBody"
  }
};

const cmsCache = {
  characters: [],
  notice: []
};

/* ========================================
   마크다운 파일 읽기
======================================== */

/*
  Pages CMS 파일 예시:

  ---
  title: 테스트 캐릭터
  image: /media/example.png
  ---
  안녕하세요. 테스트입니다.
*/

function parseMarkdownFile(source, fallbackTitle) {
  const normalized = source.replace(/\r\n/g, "\n");

  let metadata = {};
  let body = normalized;

  if (normalized.startsWith("---\n")) {
    const closing = normalized.indexOf("\n---", 4);

    if (closing !== -1) {
      const frontmatter = normalized.slice(4, closing);
      body = normalized.slice(closing + 4).trim();

      let currentKey = null;

      for (const line of frontmatter.split("\n")) {
        const match = line.match(/^([A-Za-z0-9_-]+):\s*(.*)$/);

        if (match) {
          currentKey = match[1];
          metadata[currentKey] = match[2].trim();
        } else if (
          currentKey &&
          /^\s+\S/.test(line)
        ) {
          metadata[currentKey] += " " + line.trim();
        }
      }
    }
  }

  for (const key of Object.keys(metadata)) {
    const value = metadata[key];

    if (
      (value.startsWith('"') && value.endsWith('"')) ||
      (value.startsWith("'") && value.endsWith("'"))
    ) {
      metadata[key] = value.slice(1, -1);
    }
  }

  return {
    title: metadata.title || fallbackTitle,
    image: metadata.image || "",
    body: body
  };
}

/* ========================================
   이미지 경로 처리
======================================== */

function encodePath(path) {
  return path
    .split("/")
    .map(part => encodeURIComponent(part))
    .join("/");
}

function resolveMediaUrl(path) {
  if (!path) return "";

  const cleaned = String(path).trim();

  if (/^https?:\/\//i.test(cleaned)) {
    return cleaned;
  }

  if (/^(data|javascript|blob):/i.test(cleaned)) {
    return "";
  }

  const root = window.location.origin;

  if (cleaned.startsWith("/")) {
    return root + encodePath(cleaned);
  }

  return root + "/" + encodePath(cleaned);
}

/* ========================================
   GitHub에서 글 목록 가져오기
======================================== */

async function loadCMSSection(sectionName) {
  const section = CMS_SECTIONS[sectionName];
  const list = document.getElementById(section.listId);

  list.replaceChildren();

  const loading = document.createElement("p");
  loading.className = "cms-message";
  loading.textContent = "글을 불러오는 중...";
  list.appendChild(loading);

  try {
    const apiUrl =
      "https://api.github.com/repos/" +
      GITHUB_OWNER + "/" +
      GITHUB_REPO + "/contents/" +
      section.folder +
      "?ref=" + encodeURIComponent(GITHUB_BRANCH);

    const response = await fetch(apiUrl, {
      headers: {
        Accept: "application/vnd.github+json"
      }
    });

    if (response.status === 404) {
      cmsCache[sectionName] = [];
      renderCMSList(sectionName);
      return;
    }

    if (!response.ok) {
      throw new Error("GitHub API: " + response.status);
    }

    const files = await response.json();

    if (!Array.isArray(files)) {
      throw new Error("파일 목록 형식이 올바르지 않습니다.");
    }

    const markdownFiles = files
      .filter(file =>
        file.type === "file" &&
        /\.md$/i.test(file.name)
      )
      .sort((a, b) =>
        b.name.localeCompare(a.name)
      );

    const entries = await Promise.all(
      markdownFiles.map(async file => {
        const rawUrl =
          "https://raw.githubusercontent.com/" +
          GITHUB_OWNER + "/" +
          GITHUB_REPO + "/" +
          GITHUB_BRANCH + "/" +
          encodePath(file.path);

        const fileResponse = await fetch(rawUrl);

        if (!fileResponse.ok) {
          throw new Error("글 파일을 읽을 수 없습니다.");
        }

        const source = await fileResponse.text();

        return {
          ...parseMarkdownFile(
            source,
            file.name.replace(/\.md$/i, "")
          ),
          filename: file.name
        };
      })
    );

    cmsCache[sectionName] = entries;
    renderCMSList(sectionName);

  } catch (error) {
    console.error("CMS 불러오기 오류:", error);

    list.replaceChildren();

    const message = document.createElement("p");
    message.className = "cms-message";
    message.textContent =
      "글을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.";

    const retry = document.createElement("button");
    retry.type = "button";
    retry.className = "retry-button";
    retry.textContent = "다시 불러오기";
    retry.addEventListener("click", () => {
      loadCMSSection(sectionName);
    });

    list.append(message, retry);
  }
}

/* ========================================
   글 목록 표시
======================================== */

function renderCMSList(sectionName) {
  const section = CMS_SECTIONS[sectionName];
  const list = document.getElementById(section.listId);
  const entries = cmsCache[sectionName];

  list.replaceChildren();

  if (entries.length === 0) {
    const empty = document.createElement("p");
    empty.className = "cms-message";
    empty.textContent = "아직 작성된 글이 없어요.";
    list.appendChild(empty);
    return;
  }

  entries.forEach((entry, index) => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "entry-button";
    button.textContent = entry.title;

    button.addEventListener("click", () => {
      openCMSDetail(sectionName, index);
    });

    list.appendChild(button);
  });
}

/* ========================================
   상세 페이지 열기
======================================== */

function openCMSDetail(sectionName, index) {
  const section = CMS_SECTIONS[sectionName];
  const entry = cmsCache[sectionName][index];

  if (!entry) return;

  const panel = document.querySelector(
    sectionName === "notice"
      ? ".notice-panel"
      : ".characters-panel"
  );

  const listView = panel.querySelector(".list-view");
  const detailView = document.getElementById(
    section.detailId
  );

  const title = document.getElementById(
    section.titleId
  );

  const imageArea = document.getElementById(
    section.imageId
  );

  const bodyArea = document.getElementById(
    section.bodyId
  );

  title.textContent = entry.title;

  /* 대표 이미지 */
  imageArea.replaceChildren();

  if (entry.image) {
    const imageUrl = resolveMediaUrl(entry.image);

    if (imageUrl) {
      const img = document.createElement("img");
      img.src = imageUrl;
      img.alt = entry.title;
      img.className = "detail-image";
      img.loading = "lazy";
      img.onerror = () => img.remove();
      imageArea.appendChild(img);
    }
  }

  /* 마크다운 본문 */
  bodyArea.replaceChildren();

  if (window.marked && window.DOMPurify) {
    const html = marked.parse(entry.body, {
      breaks: true,
      gfm: true
    });

    const sanitized = DOMPurify.sanitize(html);

    const template = document.createElement("template");
    template.innerHTML = sanitized;

    /* 본문에 첨부된 이미지 경로도 처리 */
    template.content.querySelectorAll("img").forEach(img => {
      const original = img.getAttribute("src");

      const resolved = resolveMediaUrl(original);

      if (resolved) {
        img.src = resolved;
        img.loading = "lazy";
      } else {
        img.remove();
      }
    });

    /* 링크는 안전한 주소만 허용 */
    template.content.querySelectorAll("a").forEach(link => {
      const href = link.getAttribute("href") || "";

      if (
        !/^(https?:\/\/|mailto:|\/|#)/i.test(href)
      ) {
        link.removeAttribute("href");
      }

      link.target = "_blank";
      link.rel = "noopener noreferrer";
    });

    bodyArea.appendChild(template.content);

  } else {
    /* 외부 라이브러리를 불러오지 못한 경우 */
    const paragraph = document.createElement("p");
    paragraph.style.whiteSpace = "pre-wrap";
    paragraph.textContent = entry.body;
    bodyArea.appendChild(paragraph);
  }

  listView.classList.add("hidden");
  detailView.classList.add("active");

  panel.querySelector(".text-panel-inner").scrollTop = 0;
}

/* ========================================
   목록으로 돌아가기
======================================== */

function resetCMSDetail(sectionName) {
  const panel = document.querySelector(
    sectionName === "notice"
      ? ".notice-panel"
      : ".characters-panel"
  );

  panel.querySelector(".detail-view")
    .classList.remove("active");

  panel.querySelector(".list-view")
    .classList.remove("hidden");

  panel.querySelector(".text-panel-inner").scrollTop = 0;
}

document.querySelectorAll("[data-back]").forEach(button => {
  button.addEventListener("click", () => {
    resetCMSDetail(button.dataset.back);
  });
});

/* ========================================
   상단 메뉴 전환
======================================== */

const contentArea = document.getElementById("contentArea");
const navButtons = document.querySelectorAll(".nav-button");

navButtons.forEach(button => {
  button.addEventListener("click", () => {
    const target = button.dataset.target;

    contentArea.dataset.view = target;

    navButtons.forEach(navButton => {
      const active = navButton === button;

      navButton.classList.toggle("active", active);
      navButton.setAttribute(
        "aria-pressed",
        String(active)
      );
    });

    if (target === "notice" || target === "characters") {
      resetCMSDetail(target);
    }
  });
});

/* ========================================
   CMS 글 불러오기 시작
======================================== */

loadCMSSection("characters");
loadCMSSection("notice");

/* ========================================
   기존 턴테이블 기능
======================================== */

const turntable = document.getElementById("turntable");
const vinyl = document.getElementById("vinyl");
const tonearm = document.getElementById("tonearm");
const audioWave = document.getElementById("audioWave");

const PIVOT_X = .77;
const PIVOT_Y = .17;

const REST_ANGLE = -27;
const MIN_ANGLE = -27;
const MAX_ANGLE = 0;
const PLAY_THRESHOLD = -12;

let currentAngle = REST_ANGLE;
let dragging = false;

let startPointerAngle = 0;
let startTonearmAngle = REST_ANGLE;

let youtubePlayer = null;
let youtubeReady = false;
let wantsToPlay = false;

/* 유튜브 API */
const youtubeScript = document.createElement("script");
youtubeScript.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(youtubeScript);

function onYouTubeIframeAPIReady() {
  youtubePlayer = new YT.Player("youtube-player", {
    width: 200,
    height: 200,
    videoId: "AJsvGtGgI6M",
    playerVars: {
      autoplay: 0,
      controls: 0,
      playsinline: 1,
      rel: 0
    },
    events: {
      onReady: function() {
        youtubeReady = true;

        if (wantsToPlay) {
          youtubePlayer.playVideo();
        }
      },
      onStateChange: function(event) {
        if (
          event.data === YT.PlayerState.PLAYING &&
          !wantsToPlay
        ) {
          youtubePlayer.pauseVideo();
        }
      }
    }
  });
}

function syncMusic(playing) {
  wantsToPlay = playing;

  if (!youtubeReady || !youtubePlayer) {
    return;
  }

  if (playing) {
    youtubePlayer.playVideo();
  } else {
    youtubePlayer.pauseVideo();
  }
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function updateTonearm(angle) {
  currentAngle = clamp(angle, MIN_ANGLE, MAX_ANGLE);

  tonearm.style.transform =
    `rotate(${currentAngle}deg)`;

  const playing = currentAngle >= PLAY_THRESHOLD;

  vinyl.classList.toggle("playing", playing);

  audioWave.classList.toggle("playing", playing);

  audioWave.setAttribute(
    "aria-label",
    playing ? "Playing" : "Stopped"
  );

  if (playing !== wantsToPlay) {
    syncMusic(playing);
  }
}

function getPivotPosition() {
  const rect = turntable.getBoundingClientRect();

  const imageLeft = rect.left + rect.width * .39;
  const imageTop = rect.top - rect.height * .08;
  const imageWidth = rect.width * .73;
  const imageHeight = imageWidth;

  return {
    x: imageLeft + imageWidth * PIVOT_X,
    y: imageTop + imageHeight * PIVOT_Y
  };
}

function getPointerAngle(event) {
  const pivot = getPivotPosition();

  return Math.atan2(
    event.clientY - pivot.y,
    event.clientX - pivot.x
  ) * 180 / Math.PI;
}

tonearm.addEventListener("pointerdown", event => {
  dragging = true;

  startPointerAngle = getPointerAngle(event);
  startTonearmAngle = currentAngle;

  tonearm.classList.add("dragging");
  tonearm.setPointerCapture(event.pointerId);

  event.preventDefault();
});

tonearm.addEventListener("pointermove", event => {
  if (!dragging) return;

  const pointerAngle = getPointerAngle(event);

  let difference = pointerAngle - startPointerAngle;

  if (difference > 180) difference -= 360;
  if (difference < -180) difference += 360;

  updateTonearm(startTonearmAngle + difference);
});

function endDrag() {
  dragging = false;
  tonearm.classList.remove("dragging");
}

tonearm.addEventListener("pointerup", endDrag);
tonearm.addEventListener("pointercancel", endDrag);
tonearm.addEventListener("lostpointercapture", endDrag);

updateTonearm(REST_ANGLE);
</script>
