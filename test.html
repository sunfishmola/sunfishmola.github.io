
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUNFISH — Turntable Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #f4f4f2;
      color: #222;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      padding: 42px 12px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: normal;
      letter-spacing: 0.25em;
    }

    .subtitle {
      margin: 0 0 30px;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #777;
    }

    /*
      턴테이블 전체 영역
      레코드판 중심을 화면 중앙에 맞춤
    */
    .turntable {
      position: relative;
      width: min(94vw, 720px);
      aspect-ratio: 1.3 / 1;
      margin: 0 auto;
      user-select: none;
      -webkit-user-select: none;
    }

    /*
      레코드판: 정확히 가운데
    */
    .vinyl {
      position: absolute;
      width: 69%;
      height: auto;
      left: 50%;
      top: 50%;
      display: block;
      transform: translate(-50%, -50%);
      transform-origin: center;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .vinyl.playing {
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      from {
        transform: translate(-50%, -50%) rotate(0deg);
      }

      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    /*
      톤암 이미지는 오른쪽 위 지지대가
      고정된 상태로 회전하도록 설정
    */
    .tonearm {
      position: absolute;
      width: 73%;
      height: auto;

      /*
        이미지의 지지대 중심이
        턴테이블 오른쪽 위에 오도록 배치
      */
      left: 39%;
      top: -8%;

      /*
        업로드한 톤암 이미지의
        오른쪽 위 원형 지지대 중심
      */
      transform-origin: 77% 17%;

      transform: rotate(-8deg);

      z-index: 2;
      cursor: grab;
      touch-action: none;
      -webkit-user-drag: none;
    }

    .tonearm.dragging {
      cursor: grabbing;
    }

    .instructions {
      margin: 22px 0 0;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #777;
      line-height: 1.8;
    }

    .status {
      margin-top: 12px;
      font-size: 12px;
      letter-spacing: 0.15em;
      color: #333;
    }

    @media (max-width: 600px) {
      .page {
        padding: 28px 4px;
      }

      .turntable {
        width: 98vw;
      }

      .subtitle {
        margin-bottom: 24px;
      }

      h1 {
        font-size: 20px;
      }

      .instructions {
        margin-top: 16px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <h1>SUNFISH</h1>
    <p class="subtitle">ANALOG SOUND EXPERIENCE</p>

    <div class="turntable" id="turntable">

      <img
        src="빈티지 선피시 레코드 레이블.png"
        class="vinyl"
        id="vinyl"
        alt="SUNFISH vinyl record"
        draggable="false"
      >

      <img
        src="실버 턴테이블 톤암 어셈블리.png"
        class="tonearm"
        id="tonearm"
        alt="Turntable tonearm"
        draggable="false"
      >

    </div>

    <p class="instructions">
      Drag the tonearm to play the record.<br>
      Move it back to stop.
    </p>

    <div class="status" id="status">STOPPED</div>

  </main>

  <script>
    const turntable = document.getElementById("turntable");
    const vinyl = document.getElementById("vinyl");
    const tonearm = document.getElementById("tonearm");
    const statusText = document.getElementById("status");

    /*
      -8도: 기본 대기 위치
      14도: 레코드 위 재생 위치

      이전처럼 바늘이 중앙 라벨까지
      넘어가지 않도록 회전 범위를 제한
    */
    const REST_ANGLE = -8;
    const MIN_ANGLE = -8;
    const MAX_ANGLE = 14;
    const PLAY_ANGLE = 5;

    /*
      이미지 안에서 실제 지지대 중심의
      상대 좌표
    */
    const PIVOT_X = 0.77;
    const PIVOT_Y = 0.17;

    let currentAngle = REST_ANGLE;
    let dragging = false;

    let startPointerAngle = 0;
    let startTonearmAngle = REST_ANGLE;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function updateTonearm(angle) {
      currentAngle = clamp(
        angle,
        MIN_ANGLE,
        MAX_ANGLE
      );

      tonearm.style.transform =
        `rotate(${currentAngle}deg)`;

      const playing = currentAngle >= PLAY_ANGLE;

      vinyl.classList.toggle("playing", playing);

      statusText.textContent = playing
        ? "PLAYING"
        : "STOPPED";
    }

    /*
      톤암의 실제 회전축 위치를 계산
    */
    function getPivotPosition() {
      const tableRect = turntable.getBoundingClientRect();

      const imageLeft =
        tableRect.left +
        tableRect.width * 0.39;

      const imageTop =
        tableRect.top -
        tableRect.height * 0.08;

      const imageWidth =
        tableRect.width * 0.73;

      /*
        톤암 이미지의 원래 가로세로 비율
        1434 x 1434 기준
      */
      const imageHeight = imageWidth;

      return {
        x: imageLeft + imageWidth * PIVOT_X,
        y: imageTop + imageHeight * PIVOT_Y
      };
    }

    function getPointerAngle(event) {
      const pivot = getPivotPosition();

      return Math.atan2(
        event.clientY - pivot.y,
        event.clientX - pivot.x
      ) * 180 / Math.PI;
    }

    tonearm.addEventListener("pointerdown", (event) => {
      dragging = true;

      startPointerAngle = getPointerAngle(event);
      startTonearmAngle = currentAngle;

      tonearm.classList.add("dragging");

      tonearm.setPointerCapture(event.pointerId);

      event.preventDefault();
    });

    tonearm.addEventListener("pointermove", (event) => {
      if (!dragging) return;

      const pointerAngle = getPointerAngle(event);

      let difference =
        pointerAngle - startPointerAngle;

      /*
        각도가 -180도 / 180도를 지날 때
        갑자기 튀지 않도록 보정
      */
      if (difference > 180) {
        difference -= 360;
      }

      if (difference < -180) {
        difference += 360;
      }

      updateTonearm(
        startTonearmAngle + difference
      );
    });

    function endDrag() {
      dragging = false;
      tonearm.classList.remove("dragging");
    }

    tonearm.addEventListener("pointerup", endDrag);
    tonearm.addEventListener("pointercancel", endDrag);
    tonearm.addEventListener("lostpointercapture", endDrag);

    updateTonearm(REST_ANGLE);
  </script>
</body>
</html>
