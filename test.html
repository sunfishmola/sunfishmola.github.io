
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUNFISH — Turntable Test</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f4f2;
      color: #222;
      font-family: Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      width: 100%;
      padding: 30px 12px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: normal;
      letter-spacing: 0.25em;
    }

    .subtitle {
      margin: 0 0 30px;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #777;
    }

    .turntable {
      position: relative;
      width: min(92vw, 650px);
      aspect-ratio: 1.3 / 1;
      margin: 0 auto;
      user-select: none;
      -webkit-user-select: none;
    }

    .vinyl {
      position: absolute;
      left: 1%;
      top: 2%;
      width: 77%;
      height: auto;
      display: block;
      transform-origin: center;
      pointer-events: none;
    }

    .vinyl.playing {
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .tonearm {
      position: absolute;
      width: 79%;
      height: auto;
      left: 28%;
      top: -5%;
      transform-origin: 79% 20%;
      transform: rotate(-10deg);
      cursor: grab;
      touch-action: none;
      -webkit-user-drag: none;
      z-index: 2;
    }

    .tonearm.dragging {
      cursor: grabbing;
    }

    .instructions {
      margin-top: 30px;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #777;
      line-height: 1.8;
    }

    .status {
      margin-top: 12px;
      font-size: 12px;
      letter-spacing: 0.15em;
      color: #333;
    }

    @media (max-width: 600px) {
      .page {
        padding: 25px 4px;
      }

      .turntable {
        width: 98vw;
      }

      h1 {
        font-size: 20px;
      }

      .instructions {
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>SUNFISH</h1>
    <p class="subtitle">ANALOG SOUND EXPERIENCE</p>

    <div class="turntable" id="turntable">
      <img
        src="vinyl.png"
        class="vinyl"
        id="vinyl"
        alt="SUNFISH vinyl record"
        draggable="false"
      >

      <img
        src="tonearm.png"
        class="tonearm"
        id="tonearm"
        alt="Turntable tonearm"
        draggable="false"
      >
    </div>

    <p class="instructions">
      Drag the tonearm to play the record.<br>
      Move it back to stop.
    </p>

    <div class="status" id="status">STOPPED</div>
  </main>

  <script>
    const turntable = document.getElementById("turntable");
    const vinyl = document.getElementById("vinyl");
    const tonearm = document.getElementById("tonearm");
    const status = document.getElementById("status");

    let dragging = false;
    let angle = -10;

    const MIN_ANGLE = -30;
    const MAX_ANGLE = 18;
    const PLAY_ANGLE = 2;

    function setAngle(value) {
      angle = Math.max(MIN_ANGLE, Math.min(MAX_ANGLE, value));

      tonearm.style.transform = `rotate(${angle}deg)`;

      const playing = angle >= PLAY_ANGLE;

      vinyl.classList.toggle("playing", playing);
      status.textContent = playing ? "PLAYING" : "STOPPED";
    }

    tonearm.addEventListener("pointerdown", (event) => {
      dragging = true;
      tonearm.classList.add("dragging");
      tonearm.setPointerCapture(event.pointerId);
      event.preventDefault();
    });

    tonearm.addEventListener("pointermove", (event) => {
      if (!dragging) return;

      const rect = turntable.getBoundingClientRect();

      const centerX = rect.left + rect.width * 0.905;
      const centerY = rect.top + rect.height * 0.11;

      const pointerAngle = Math.atan2(
        event.clientY - centerY,
        event.clientX - centerX
      ) * 180 / Math.PI;

      const nextAngle = pointerAngle + 145;

      setAngle(nextAngle);
    });

    function endDrag() {
      dragging = false;
      tonearm.classList.remove("dragging");
    }

    tonearm.addEventListener("pointerup", endDrag);
    tonearm.addEventListener("pointercancel", endDrag);
    tonearm.addEventListener("lostpointercapture", endDrag);

    setAngle(-10);
  </script>
</body>
</html>
