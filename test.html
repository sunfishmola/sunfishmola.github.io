
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUNFISH — Turntable Test</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap');

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  width: 100%;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  background-color: #fff;
  background-image: url("싸움.png");
  background-repeat: no-repeat;
  background-size: auto 90vh;
  background-position: calc(100% - 120px) bottom;
  background-attachment: fixed;
  color: #111;
  font-family: Georgia, "Times New Roman", serif;
}

.page {
  min-height: 100vh;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding: 40px 5vw;
}

.player-area {
  width: min(100%, 650px);
  text-align: center;
  flex-shrink: 0;
}

/* SUNFISH — 좁은 자간 + 회색 잉크 번짐 */
h1 {
  position: relative;
  display: inline-block;
  margin: 0 0 8px;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 38px;
  font-weight: 300;
  line-height: 1.1;
  letter-spacing: .035em;
  color: #777777;

  text-shadow:
    0 0 1px rgba(90, 90, 90, .25),
    0 0 4px rgba(100, 100, 100, .18),
    0 0 10px rgba(120, 120, 120, .12);
}

h1::after {
  content: attr(data-text);
  position: absolute;
  inset: 0;
  color: rgba(110, 110, 110, .25);
  filter: blur(2.5px);
  transform: translate(.8px, .7px);
  pointer-events: none;
}

.subtitle {
  margin: 0 0 28px;
  font-size: 11px;
  letter-spacing: .2em;
  color: #555;
}

.turntable {
  position: relative;
  width: min(100%, 576px);
  aspect-ratio: 1.3 / 1;
  margin: 0 auto;
  user-select: none;
  -webkit-user-select: none;
}

.vinyl {
  position: absolute;
  width: 100%;
  height: auto;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  transform-origin: center;
  display: block;
  pointer-events: none;
  -webkit-user-drag: none;
}

.vinyl.playing {
  animation: spin 3s linear infinite;
}

@keyframes spin {
  from {
    transform: translate(-50%, -50%) rotate(0deg);
  }
  to {
    transform: translate(-50%, -50%) rotate(360deg);
  }
}

.tonearm {
  position: absolute;
  width: 73%;
  height: auto;
  left: 39%;
  top: -8%;
  transform-origin: 77% 17%;
  transform: rotate(0deg);
  z-index: 2;
  cursor: grab;
  touch-action: none;
  -webkit-user-drag: none;
}

.tonearm.dragging {
  cursor: grabbing;
}

.instructions {
  margin: 18px 0 0;
  font-size: 12px;
  line-height: 1.8;
  color: #444;
}

/* 오디오 파형 */
.audio-wave {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: 54px;
  margin: 4px auto 0;
}

.audio-wave .bar {
  display: block;
  width: 5px;
  height: var(--height);
  border-radius: 999px;
  background: #777777;
  opacity: .65;
  box-shadow: 0 0 5px rgba(110, 110, 110, .15);
  transform-origin: center;
  animation: waveMove var(--duration) ease-in-out infinite alternate;
  animation-play-state: paused;
}

.audio-wave.playing .bar {
  animation-play-state: running;
}

@keyframes waveMove {
  from {
    transform: scaleY(.3);
  }
  to {
    transform: scaleY(1.25);
  }
}

.couple-mobile {
  display: none;
}

/* 기존 유튜브 연결 유지 */
.youtube-player-wrap {
  position: fixed;
  left: -300px;
  top: -300px;
  width: 200px;
  height: 200px;
  overflow: hidden;
  pointer-events: none;
  opacity: .01;
}

#youtube-player {
  width: 200px;
  height: 200px;
}

@media (max-width: 700px) {
  body {
    background-image: none;
    background-color: #fff;
  }

  .page {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 34px 0 0;
  }

  .player-area {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    flex-shrink: 0;
    padding: 0 12px;
  }

  h1 {
    font-size: 32px;
    letter-spacing: .035em;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 10px;
    margin-bottom: 18px;
  }

  .turntable {
    width: min(76vw, 380px);
    margin: 0 auto;
  }

  .instructions {
    display: block;
    width: fit-content;
    max-width: 100%;
    margin: 18px auto 0;
    padding: 0;
    font-size: 11px;
    line-height: 1.7;
    color: #444;
  }

  .audio-wave {
    height: 48px;
    gap: 4px;
    margin-top: 2px;
  }

  .audio-wave .bar {
    width: 4px;
  }

  .couple-mobile {
    display: block;
    width: 100%;
    margin-top: 36px;
    text-align: center;
    line-height: 0;
    overflow: hidden;
  }

  .couple-mobile img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 78svh;
    margin: 0 auto;
    object-fit: contain;
  }
}

@media (prefers-reduced-motion: reduce) {
  .audio-wave .bar {
    animation: none;
  }
}
</style>
</head>

<body>

<main class="page">

  <section class="player-area">

    <h1 data-text="SUNFISH">SUNFISH</h1>
    <p class="subtitle">ANALOG SOUND EXPERIENCE</p>

    <div class="turntable" id="turntable">

      <img
        src="레코드.png"
        class="vinyl"
        id="vinyl"
        alt="Black vinyl record"
        draggable="false"
      >

      <img
        src="실버 턴테이블 톤암 어셈블리.png"
        class="tonearm"
        id="tonearm"
        alt="Turntable tonearm"
        draggable="false"
      >

    </div>

    <p class="instructions">
      Move the tonearm onto the record to play.<br>
      Move it back to stop.
    </p>

    <!-- PLAYING / STOPPED 대신 오디오 파형 -->
    <div
      class="audio-wave"
      id="audioWave"
      role="status"
      aria-label="Stopped"
    >
      <span class="bar" style="--height:22px;--duration:.75s"></span>
      <span class="bar" style="--height:30px;--duration:1.10s"></span>
      <span class="bar" style="--height:25px;--duration:.85s"></span>
      <span class="bar" style="--height:40px;--duration:1.20s"></span>
      <span class="bar" style="--height:34px;--duration:.70s"></span>
      <span class="bar" style="--height:26px;--duration:1.05s"></span>
      <span class="bar" style="--height:36px;--duration:.90s"></span>
      <span class="bar" style="--height:20px;--duration:1.15s"></span>
      <span class="bar" style="--height:44px;--duration:.80s"></span>
      <span class="bar" style="--height:12px;--duration:1.25s"></span>
      <span class="bar" style="--height:24px;--duration:.95s"></span>
      <span class="bar" style="--height:30px;--duration:.72s"></span>
      <span class="bar" style="--height:26px;--duration:1.12s"></span>
      <span class="bar" style="--height:18px;--duration:.88s"></span>
    </div>

  </section>

  <div class="couple-mobile">
    <img
      src="싸움.png"
      alt="Couple illustration"
      draggable="false"
    >
  </div>

</main>

<!-- 화면 밖 유튜브 플레이어 -->
<div class="youtube-player-wrap" aria-hidden="true">
  <div id="youtube-player"></div>
</div>

<script>
const turntable = document.getElementById("turntable");
const vinyl = document.getElementById("vinyl");
const tonearm = document.getElementById("tonearm");
const audioWave = document.getElementById("audioWave");

const PIVOT_X = .77;
const PIVOT_Y = .17;

const REST_ANGLE = -27;
const MIN_ANGLE = -27;
const MAX_ANGLE = 0;
const PLAY_THRESHOLD = -12;

let currentAngle = REST_ANGLE;
let dragging = false;

let startPointerAngle = 0;
let startTonearmAngle = REST_ANGLE;

let youtubePlayer = null;
let youtubeReady = false;
let wantsToPlay = false;

/* 유튜브 API 불러오기 */
const youtubeScript = document.createElement("script");
youtubeScript.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(youtubeScript);

function onYouTubeIframeAPIReady() {
  youtubePlayer = new YT.Player("youtube-player", {
    width: 200,
    height: 200,
    videoId: "AJsvGtGgI6M",
    playerVars: {
      autoplay: 0,
      controls: 0,
      playsinline: 1,
      rel: 0
    },
    events: {
      onReady: function() {
        youtubeReady = true;

        if (wantsToPlay) {
          youtubePlayer.playVideo();
        }
      },
      onStateChange: function(event) {
        if (
          event.data === YT.PlayerState.PLAYING &&
          !wantsToPlay
        ) {
          youtubePlayer.pauseVideo();
        }
      }
    }
  });
}

function syncMusic(playing) {
  wantsToPlay = playing;

  if (!youtubeReady || !youtubePlayer) {
    return;
  }

  if (playing) {
    youtubePlayer.playVideo();
  } else {
    youtubePlayer.pauseVideo();
  }
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function updateTonearm(angle) {
  currentAngle = clamp(angle, MIN_ANGLE, MAX_ANGLE);

  tonearm.style.transform =
    `rotate(${currentAngle}deg)`;

  const playing = currentAngle >= PLAY_THRESHOLD;

  vinyl.classList.toggle("playing", playing);

  /* 음악 재생 시 파형 움직임 */
  audioWave.classList.toggle("playing", playing);
  audioWave.setAttribute(
    "aria-label",
    playing ? "Playing" : "Stopped"
  );

  if (playing !== wantsToPlay) {
    syncMusic(playing);
  }
}

function getPivotPosition() {
  const rect = turntable.getBoundingClientRect();

  const imageLeft = rect.left + rect.width * .39;
  const imageTop = rect.top - rect.height * .08;
  const imageWidth = rect.width * .73;
  const imageHeight = imageWidth;

  return {
    x: imageLeft + imageWidth * PIVOT_X,
    y: imageTop + imageHeight * PIVOT_Y
  };
}

function getPointerAngle(event) {
  const pivot = getPivotPosition();

  return Math.atan2(
    event.clientY - pivot.y,
    event.clientX - pivot.x
  ) * 180 / Math.PI;
}

tonearm.addEventListener("pointerdown", event => {
  dragging = true;

  startPointerAngle = getPointerAngle(event);
  startTonearmAngle = currentAngle;

  tonearm.classList.add("dragging");
  tonearm.setPointerCapture(event.pointerId);

  event.preventDefault();
});

tonearm.addEventListener("pointermove", event => {
  if (!dragging) return;

  const pointerAngle = getPointerAngle(event);

  let difference = pointerAngle - startPointerAngle;

  if (difference > 180) difference -= 360;
  if (difference < -180) difference += 360;

  updateTonearm(startTonearmAngle + difference);
});

function endDrag() {
  dragging = false;
  tonearm.classList.remove("dragging");
}

tonearm.addEventListener("pointerup", endDrag);
tonearm.addEventListener("pointercancel", endDrag);
tonearm.addEventListener("lostpointercapture", endDrag);

updateTonearm(REST_ANGLE);
</script>

</body>
</html>
