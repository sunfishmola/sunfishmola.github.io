
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUNFISH — Turntable Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background-color: #fff;
      background-image: url("커플.png");
      background-repeat: no-repeat;
      background-size: auto 90vh;
      background-position: calc(100% - 120px) bottom;
      background-attachment: fixed;

      color: #111;
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 5vw;
    }

    .player-area {
      width: min(100%, 650px);
      text-align: center;
      flex-shrink: 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: normal;
      letter-spacing: 0.25em;
    }

    .subtitle {
      margin: 0 0 28px;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #555;
    }

    .turntable {
      position: relative;
      width: min(100%, 576px);
      aspect-ratio: 1.3 / 1;
      margin: 0 auto;
      user-select: none;
      -webkit-user-select: none;
    }

    .vinyl {
      position: absolute;
      width: 100%;
      height: auto;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      transform-origin: center;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .vinyl.playing {
      animation: spin 3s linear infinite;
    }

    @keyframes spin {
      from {
        transform: translate(-50%, -50%) rotate(0deg);
      }

      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    .tonearm {
      position: absolute;
      width: 73%;
      height: auto;
      left: 39%;
      top: -8%;
      transform-origin: 77% 17%;
      transform: rotate(0deg);
      z-index: 2;
      cursor: grab;
      touch-action: none;
      -webkit-user-drag: none;
    }

    .tonearm.dragging {
      cursor: grabbing;
    }

    .instructions {
      margin: 18px 0 0;
      font-size: 12px;
      line-height: 1.8;
      color: #444;
    }

    .status {
      margin-top: 12px;
      font-size: 12px;
      letter-spacing: 0.15em;
      color: #111;
    }

    /*
      유튜브 플레이어는 실제 화면에 표시.
      톤암으로 재생 제어 가능.
    */
    .youtube-area {
      width: min(100%, 320px);
      margin: 18px auto 0;
    }

    .youtube-area iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
    }

    .couple-mobile {
      display: none;
    }

    @media (max-width: 700px) {
      body {
        background-image: none;
        background-color: #fff;
      }

      .page {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 34px 0 0;
      }

      .player-area {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        flex-shrink: 0;
        padding: 0 12px;
      }

      h1 {
        font-size: 20px;
        margin-bottom: 8px;
      }

      .subtitle {
        font-size: 10px;
        margin-bottom: 18px;
      }

      .turntable {
        width: min(76vw, 380px);
        margin: 0 auto;
      }

      .instructions {
        display: block;
        width: fit-content;
        max-width: 100%;
        margin: 18px auto 0;
        padding: 0;
        font-size: 11px;
        line-height: 1.7;
        color: #444;
        background: none;
      }

      .status {
        width: fit-content;
        margin: 10px auto 0;
        padding: 0;
        font-size: 11px;
        color: #111;
        background: none;
      }

      .youtube-area {
        width: min(100%, 280px);
        margin-top: 16px;
      }

      .couple-mobile {
        display: block;
        width: 100%;
        margin-top: 36px;
        text-align: center;
        line-height: 0;
        overflow: hidden;
      }

      .couple-mobile img {
        display: block;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 78svh;
        margin: 0 auto;
        object-fit: contain;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <section class="player-area">

      <h1>SUNFISH</h1>
      <p class="subtitle">ANALOG SOUND EXPERIENCE</p>

      <div class="turntable" id="turntable">

        <img
          src="레코드.png"
          class="vinyl"
          id="vinyl"
          alt="Black vinyl record"
          draggable="false"
        >

        <img
          src="실버 턴테이블 톤암 어셈블리.png"
          class="tonearm"
          id="tonearm"
          alt="Turntable tonearm"
          draggable="false"
        >

      </div>

      <p class="instructions">
        Move the tonearm onto the record to play.<br>
        Move it back to stop.
      </p>

      <div class="status" id="status">STOPPED</div>

      <div class="youtube-area">
        <div id="youtube-player"></div>
      </div>

    </section>

    <div class="couple-mobile">
      <img
        src="커플.png"
        alt="Couple illustration"
        draggable="false"
      >
    </div>

  </main>

  <script>
    const turntable = document.getElementById("turntable");
    const vinyl = document.getElementById("vinyl");
    const tonearm = document.getElementById("tonearm");
    const statusText = document.getElementById("status");

    const PIVOT_X = 0.77;
    const PIVOT_Y = 0.17;

    const REST_ANGLE = -27;
    const MIN_ANGLE = -27;
    const MAX_ANGLE = 0;
    const PLAY_THRESHOLD = -12;

    let currentAngle = REST_ANGLE;
    let dragging = false;

    let startPointerAngle = 0;
    let startTonearmAngle = REST_ANGLE;

    let youtubePlayer = null;
    let youtubeReady = false;
    let wantsToPlay = false;

    /*
      YouTube IFrame Player API 로드
    */
    const youtubeScript = document.createElement("script");
    youtubeScript.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(youtubeScript);

    function onYouTubeIframeAPIReady() {
      youtubePlayer = new YT.Player("youtube-player", {
        width: "320",
        height: "180",
        videoId: "AJsvGtGgI6M",
        playerVars: {
          playsinline: 1,
          controls: 1,
          rel: 0
        },
        events: {
          onReady: function () {
            youtubeReady = true;

            if (wantsToPlay) {
              youtubePlayer.playVideo();
            }
          }
        }
      });
    }

    function syncMusic(playing) {
      wantsToPlay = playing;

      if (!youtubeReady || !youtubePlayer) {
        return;
      }

      if (playing) {
        youtubePlayer.playVideo();
      } else {
        youtubePlayer.pauseVideo();
      }
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function updateTonearm(angle) {
      currentAngle = clamp(angle, MIN_ANGLE, MAX_ANGLE);

      tonearm.style.transform =
        `rotate(${currentAngle}deg)`;

      const playing = currentAngle >= PLAY_THRESHOLD;

      vinyl.classList.toggle("playing", playing);

      statusText.textContent =
        playing ? "PLAYING" : "STOPPED";

      /*
        재생 상태가 바뀔 때만 유튜브 제어
      */
      if (playing !== wantsToPlay) {
        syncMusic(playing);
      }
    }

    function getPivotPosition() {
      const rect = turntable.getBoundingClientRect();

      const imageLeft = rect.left + rect.width * 0.39;
      const imageTop = rect.top - rect.height * 0.08;
      const imageWidth = rect.width * 0.73;
      const imageHeight = imageWidth;

      return {
        x: imageLeft + imageWidth * PIVOT_X,
        y: imageTop + imageHeight * PIVOT_Y
      };
    }

    function getPointerAngle(event) {
      const pivot = getPivotPosition();

      return Math.atan2(
        event.clientY - pivot.y,
        event.clientX - pivot.x
      ) * 180 / Math.PI;
    }

    tonearm.addEventListener("pointerdown", (event) => {
      dragging = true;

      startPointerAngle = getPointerAngle(event);
      startTonearmAngle = currentAngle;

      tonearm.classList.add("dragging");
      tonearm.setPointerCapture(event.pointerId);

      event.preventDefault();
    });

    tonearm.addEventListener("pointermove", (event) => {
      if (!dragging) return;

      const pointerAngle = getPointerAngle(event);

      let difference = pointerAngle - startPointerAngle;

      if (difference > 180) difference -= 360;
      if (difference < -180) difference += 360;

      updateTonearm(startTonearmAngle + difference);
    });

    function endDrag() {
      dragging = false;
      tonearm.classList.remove("dragging");
    }

    tonearm.addEventListener("pointerup", endDrag);
    tonearm.addEventListener("pointercancel", endDrag);
    tonearm.addEventListener("lostpointercapture", endDrag);

    updateTonearm(REST_ANGLE);
  </script>
</body>
</html>
